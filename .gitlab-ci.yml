# GitLab CI — hermetic tier + the platform's own security scanners (engineering/CI.md).
#
# GitLab is the mirror host: shared runners run the SAME scripts/ci/hermetic.sh
# as the GitHub `hermetic` job (typecheck + lint + DB-less tripwires), so the
# two platforms cannot drift. The self-hosted tiers (live Postgres, PHP oracle,
# client gate) run ONLY via GitHub Actions — one runner machine-owner, no
# cross-system collision on the shared scratch DB surfaces.
#
# THE IMAGE IS THE CI IMAGE (2026-09-26) — ghcr.io/dedalia-org/dedalo-ci (the pin below
# may still name the transition's legacy ghcr.io/renderpci/dedalo-ci until it is re-pinned —
# engineering/CI.md "Moving the CI image repository"), the one
# ci:local and the GitHub tiers use (ci/README.md), pinned by DIGEST, run as uid 1001
# (the GitHub runner's, and ci:local's `runner`). It was bare oven/bun as root: no git
# (site_builder publishes through git) and root defeats the uid/permission gates, so
# hermetic here was red on master from 2026-08 while GitHub was green. The digest is
# ci/image.json's (scripts/lib/ci_image.ts), whose fingerprint must equal
# sha256(ci/Dockerfile ++ .bun-version) — that keeps the load-bearing Bun.sql jsonb pin
# binding here: a .bun-version or Dockerfile edit is red until `bun run ci:image:pin`
# moves every copy to the build ci-image.yml publishes for it.
# test/unit/ci_workflow_tripwire.test.ts enforces both.
#
# SECURITY SCANNERS (added 2026-08-03). The two platforms are NOT symmetric here, and
# that is deliberate rather than drift: GitHub runs CodeQL + gitleaks from
# .github/workflows/, GitLab runs its own bundled equivalents below. Each host's
# scanner is free, maintained, and integrated with that host's UI; reimplementing
# GitHub's choices on GitLab would buy nothing and cost a second thing to keep current.
# What must NOT differ is the repo's OWN gate — hence one shared hermetic.sh.
#
# The templates are GitLab-maintained (Semgrep-based SAST, gitleaks-based Secret
# Detection). They add jobs to the `test` stage on merge requests and the default
# branch; on a plan without Ultimate they still RUN and still fail the job on a
# finding — only the MR security widget is gated behind the licence.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Secret Detection is gitleaks under the hood, so it is pointed at the SAME
# `.gitleaks.toml` the GitHub job uses — via the documented ruleset passthrough in
# `.gitlab/secret-detection-ruleset.toml`. One allowlist, triaged once; an exception
# cannot exist on one platform only. (That file, not this one, is where the wiring
# lives — see its header for the shape and the verify-on-first-run note.)

hermetic:
  image:
    name: ghcr.io/dedalia-org/dedalo-ci@sha256:24295d498923e0403b36409e4ad4ba961bd6f8d534463bc9c2db0bc81f70f759
    docker:
      user: "1001"
  # uid 1001 has no passwd entry in the image, so HOME would be `/` (unwritable): bun's
  # install cache and git's global config need a real one. Set in the JOB's shell, never
  # as a job `variables:` entry — those reach the runner's helper container too, whose
  # clone then died on `could not lock config file /tmp/runner-home/.gitconfig`
  # (measured 2026-09-26, the first run in this image).
  #
  # THE CHECKOUT IS WORLD-WRITABLE (measured 2026-10-01, job 16877431807): the docker
  # executor clones as root under `umask 0000`, so every file is 0666 and every dir 0777.
  # Gates that judge WHO CAN CHANGE a file (site_builder's confinement: "the egress shim is
  # group- or world-writable") refuse that tree — correctly; a museum host never looks like
  # this. uid 1001 cannot chmod root's files, so the job works on its OWN copy, made under
  # a normal umask: the modes GitHub's checkout and ci:local's clone have. The copy keeps
  # .git (shallow history included); before_script and script share one shell, so the
  # `cd` holds for the tier.
  before_script:
    - export HOME=/tmp/runner-home
    - mkdir -p "$HOME"
    - umask 022
    - cp -R "$CI_PROJECT_DIR" /tmp/dedalo-src
    - cd /tmp/dedalo-src
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - bash scripts/ci/hermetic.sh
