# Secret-scanning config (gitleaks) — see .github/workflows/security.yml.
#
# The engine's real secrets live in `../private/.env`, OUTSIDE the repo by design, and
# nothing in the tree may read `process.env` outside src/config/ (config_env_tripwire).
# This scan is the belt to that braces: it catches the credential that arrives by
# accident — pasted into a doc, committed in a fixture, left in a debug script.
#
# EXTEND THE DEFAULT RULES, NEVER REPLACE THEM: `[extend] useDefault = true` keeps the
# ~170 upstream provider rules. Only verified false positives are allowed
# through, each scoped as tightly as the finding (a path OR a literal), because a broad
# allowlist is how a secret scanner ends up scanning nothing.

title = "Dédalo v7"

[extend]
useDefault = true

[[allowlists]]
description = "Vendored third-party bundles we ship verbatim — minified base64 blobs read as high-entropy keys, and we do not edit these bytes."
paths = [
  '''client/dedalo/lib/''',
  '''publication/.*/docu/ui/''',
]

[[allowlists]]
description = "Documentation placeholders. Scoped to the literal example values, not to docs/ — a REAL key pasted into the manual must still fail."
regexes = [
  '''key_live_abc123''',
]

[[allowlists]]
description = "Installer gates' SENTINEL credentials (2026-10-13, terminal installer phases 1-6): fixed made-up literals the tests plant to prove a secret never reaches argv, logs or run files. Scoped to the exact values only (no path: this gitleaks ignores condition=AND in global allowlists, so a test/ path would have allowed every secret under test/ — measured). A real key anywhere, tests included, still fails."
regexes = [
  '''Mosaic-Kestrel-Harbor-47''',
  '''Sentinel-Root-Kestrel-91''',
  '''Kestrel-Harbor-6789''',
  '''SENTINEL-db-7Qx2''',
  '''Db-SentinelWombat-93''',
  '''Zz-DbSentinel-4417''',
  '''Zz-MySentinel-5528''',
  '''Zz-Db-Secret-61x''',
  '''Zz-ProbeSecret-9931''',
]

[[allowlists]]
description = "Geo/map gates' SENTINEL tokens and a config KEY NAME (2026-11-08, first hosted scan of the maps work): `tok_SECRET_<n>` are made-up literals the tests plant to prove a URL token never reaches a reason or a log line; `DEDALO_NAT64_PREFIXES` is a setting's NAME in a pinned-settings list, read as a value because the line above it names DEDALO_DEBUG_API_ERRORS. Scoped to the exact values only (no path — see the installer block above)."
regexes = [
  '''^tok_SECRET_(4711|0815|9f3a)$''',
  '''^DEDALO_NAT64_PREFIXES$''',
]

# ---------------------------------------------------------------------------
# HISTORY ONLY (the weekly full-history scan; none of this exists in the tree).
#
# The 2026-08-03 first full run reported 178 hits over 38,980 commits and 3.8 GB.
# Every one was triaged; NONE was a live Dédalo credential. What they were:
#   - composer/npm VENDOR trees from the PHP era (`vendor/`, `lib/`) — library test
#     fixtures: onelogin/php-saml example private keys, react's localhost.pem,
#     leaflet's docs full of Mapbox demo tokens. Third-party bytes, third-party
#     example keys, deleted from the tree at the cutover.
#   - `core/component_geolocation/js/component_geolocation.js` — Mapbox `pk.` tokens
#     and a CloudMade key inside COMMENTED-OUT example URLs (2020, 2023). Mapbox `pk.`
#     tokens are public by design (they ship in client JS and are restricted by
#     referrer), and CloudMade has not existed for a decade. Retired PHP client.
# Recorded here rather than in a report, because the alternative is a weekly job that
# is permanently red and therefore permanently unread.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Vendored PHP/JS dependency trees that existed only before the TS cutover — third-party example keys, deleted from the current tree."
paths = [
  '''^vendor/''',
  '''^lib/''',
  '''^core/component_geolocation/js/component_geolocation\.js$''',
]

[[allowlists]]
description = "Entropy false positives on values that are not secrets: AI MODEL NAMES in tool_assistant's register.json (`qwen3.6-35b-a3b-mlx` reads as a key to any entropy rule), and a migration flag quoted in a skill doc."
# regexTarget = "match" — WITHOUT this, a regex here is tested against the SECRET
# alone (gitleaks' default), so an anchor like `api_model":` can never match and the
# allowlist silently does nothing. That is precisely how the first draft of this block
# left 5 findings standing while looking correct.
regexTarget = "match"
regexes = [
  '''api_model"\s*:\s*"[A-Za-z0-9._-]+"''',
  '''legacy_unmigrated=\d+''',
]

# ---------------------------------------------------------------------------
# VERIFIED FALSE POSITIVES IN THE TREE (triaged 2026-10-09, the publication-host push).
# Each block is ONE finding: its FILE *and* its literal (condition = "AND"), so the same
# value anywhere else — or anything else in that file — is still scanned.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Bun's release-signing key FINGERPRINT — a public identifier (the key itself is public), pinned so the CI image verifies the Bun download."
condition = "AND"
paths = ['''(^|/)scripts/ci/bun_pin_hashes\.ts$''']
regexes = ['''^F3DCC08A8572C0749B3E18888EAB4D40A7B22B59$''']

[[allowlists]]
description = "Test fixture: a made-up SECRET the init report test feeds in to prove it is REDACTED from the report."
condition = "AND"
paths = ['''(^|/)publication/host_agent/tests/init_report\.test\.ts$''']
regexes = ['''^Zq7pX2kN9wLm4vRt$''']

[[allowlists]]
description = "Test fixture: a made-up publication DB password the v2 .env renderer test writes and reads back."
condition = "AND"
paths = ['''(^|/)test/unit/publication_host_init_v2_env_native\.test\.ts$''']
regexes = ['''^abcdefgh12345678$''']

[[allowlists]]
description = "Test fixture: a planted PEM HEADER string (no key material) the kit packer must REFUSE to ship."
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)test/unit/publication_host_kit_pack\.test\.ts$''']
regexes = ['''-----BEGIN PRIVATE KEY-----';''']
