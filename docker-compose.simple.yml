# Dédalo v7 — SIMPLE stack: a complete, ready-to-use instance in one command.
#
# Operator guide: docs/install/quickstart.md
#
#   Install with the terminal installer (it asks you the questions, writes
#   /private/.env through a one-shot engine container, then starts the stack):
#       ./install.sh
#
#   There is no browser install: an engine container started before the
#   installer ran finds no configuration, prints one "[boot] REFUSED — not
#   installed" line and exits 78 (Docker restarts it with its capped backoff,
#   printing the same line each time) until the installer has written it.
#
# THE IMAGE. install.sh asks where it comes from — one of Dédalo's registries, a
# registry of your own, or a local build — and records the answer in .dedalo.env:
# DEDALO_IMAGE, DEDALO_VERSION (pinned), DEDALO_IMAGE_MODE (pull | build),
# DEDALO_IMAGE_VERIFY and DEDALO_COMPOSE_FILE. Every later update
# (deploy/dedalo-image-update.sh) comes from the same place.
#
# WHAT THIS TRADES AWAY, on purpose, to fit in one command:
#   * no TLS — plain HTTP, so SESSION_COOKIE_SECURE must be false (a browser
#     silently discards a Secure cookie over http://, and nobody could log in);
#   * no media access control — every media file is readable by anyone who can
#     reach the server, logged in or not (deploy/nginx.simple.conf serves the
#     media tree openly, with no per-record and no per-project checks).
#
# Both are fine on a machine only your institution's network can reach. Neither
# is acceptable on the public internet — for that, use docker-compose.yml and
# docs/install/docker.md, which add TLS and the engine-enforced media gate.
#
# GROWING OUT OF IT: the volume names here are the same as docker-compose.yml's,
# so moving to the full stack is additive (add TLS, set DEDALO_MEDIA_ACCESS_MODE,
# swap the nginx config) — never a reinstall. The data never moves.

# THIRD-PARTY IMAGES ARE PINNED `name:<version>@sha256:<index digest>` (T1-17):
# the readable version plus the exact multi-arch bytes, so two installs of one
# release run the same images and a repointed upstream tag changes nothing
# here. Dependabot (.github/dependabot.yml, docker-compose `/`) proposes the
# bumps; the installer reads these lines (src/core/install/host/stack/images.ts)
# instead of copying them. Gate: test/unit/operator_image_pin_tripwire.test.ts.

name: dedalo

services:
  # --- PostgreSQL: the system of record --------------------------------------
  # Creates an EMPTY database owned by the role, which is exactly the installer's
  # precondition (it restores INTO a database, refuses a non-empty one, and never
  # creates one itself).
  #
  # The defaults below are intentionally boring: this port is NOT published, so
  # the database is reachable only from the other containers on this network.
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dedalo}
      POSTGRES_USER: ${POSTGRES_USER:-dedalo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dedalo}
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. From 18 the official
      # image stores data in a major-version subdirectory (PGDATA is
      # /var/lib/postgresql/18/docker) so that pg_upgrade --link works across a
      # single mount point. A volume on the old .../data path is detected as an
      # "unused mount/volume" and the container REFUSES TO START.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dedalo} -d ${POSTGRES_DB:-dedalo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- The engine ------------------------------------------------------------
  dedalo:
    # THE IMAGE IS NAMED AND PINNED, never built implicitly (installer unification
    # D2). DEDALO_IMAGE (a repository, no tag) and DEDALO_VERSION (the release tag)
    # come from .dedalo.env, which install.sh writes from the operator's answer:
    # one of Dédalo's registries (engineering/image_registries.json), a registry of
    # your own, or a local build. Building here is deploy/dedalo-image-build.sh
    # (a clean snapshot of the last commit), tagged with this same name.
    # The default `localhost/dedalo:local` names the registry host `localhost`, so
    # a bare `docker compose up` can never pull a look-alike image from a public
    # registry: without a local build it fails loudly instead.
    image: ${DEDALO_IMAGE:-localhost/dedalo}:${DEDALO_VERSION:-local}
    # The container equivalent of systemd's Restart=always — and what brings the
    # engine back after a planned restart (exit 75: a code update).
    restart: unless-stopped
    # THE SUPERVISOR MUST OUTLAST THE DRAIN (P2-33 / OPS-10).
    #
    # SERVER_SHUTDOWN_GRACE_MS defaults to 10000, and the config catalog states
    # the relation as a RULE: "Keep it below the stop timeout of whatever
    # supervises the process, or the supervisor will kill the server before the
    # drain has finished — which defeats the purpose."
    #
    # Docker's default stop_grace_period is 10s. EXACTLY EQUAL is not below: a
    # restart that genuinely needs the drain is SIGKILLed at the boundary,
    # before interruptLive() and closeDatabasePool() run — so a curator
    # mid-save is cut off by a routine `compose up -d`, which is the one thing
    # the drain exists to prevent.
    #
    # 30s leaves a 20s margin over the default drain. An operator who RAISES
    # SERVER_SHUTDOWN_GRACE_MS must raise this too; the rule is the catalog's,
    # and this line is the shipped stack keeping it.
    stop_grace_period: 30s
    # LOG ROTATION (P2-33 / OPS-12). Both stacks set DEDALO_ACCESS_LOG=true, and
    # Docker's default json-file driver has NO SIZE LIMIT: an access-logged
    # install fills the host disk with container logs and takes the database
    # down with it — on the same volume, since json-file writes under
    # /var/lib/docker. A heritage install that stops serving because its own
    # request log ate the disk is the avoidable kind of outage.
    #
    # 3 x 10 MB keeps roughly the last week of a small institution's traffic and
    # is bounded whatever happens. An operator wanting more should raise
    # max-file, not remove the cap.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DELIBERATELY ABSENT: ENTITY, DB_NAME, DB_HOST, DB_USER. The installer
      # writes them into /private/.env (src/config/install_state.ts reads the
      # same four to decide "installed or not"). Setting them here would shadow
      # that file — the install answers reach the engine as installer answers,
      # never as container environment.
      DEDALO_PRIVATE_DIR: /private
      # SUPERVISION IS DECLARED BY THE SUPERVISOR. `restart: unless-stopped` above
      # is what brings the server back after a planned exit, so the stack says so
      # here — never in /private/.env, which every launch method reads and the
      # engine therefore ignores for this key (src/core/update/supervision.ts).
      # An image install still cannot tree-swap: channel detection refuses that
      # update on its own, whatever this says.
      DEDALO_SUPERVISED: "true"
      # WHERE THIS ENGINE'S IMAGE CAME FROM, as the operator chose it in .dedalo.env.
      # The code-update panel shows the source and the host command from it
      # (src/core/update/image_source.ts). Process environment only — never
      # /private/.env, which outlives the image. Not DEDALO_IMAGE_*: that prefix is
      # the media-image configuration family.
      DEDALO_CONTAINER_IMAGE: ${DEDALO_IMAGE:-localhost/dedalo}
      DEDALO_CONTAINER_IMAGE_MODE: ${DEDALO_IMAGE_MODE:-build}
      # THE ENGINE PUBLISHES ITS OWN CLIENT. At every start it mirrors the client
      # tree of THIS image into the `client` volume and switches it atomically
      # (src/core/install/client_publish.ts); nginx serves it from there. A host
      # bind of ./client served the CHECKOUT's client against a pulled engine of
      # another version, and the wire contract between the two is exact.
      DEDALO_CLIENT_PUBLISH_DIR: /srv/dedalo/client
      SERVER_UNIX_SOCKET: /run/dedalo/dedalo_ts.sock
      MEDIA_PATH: /srv/dedalo/media
      # ONTOLOGY FILES LIVE IN /private, NEVER THE IMAGE TREE. Unset, the default
      # resolves to the in-tree install/import/ontology (it ships the vendored
      # seeds), and the image tree is root-owned: every ontology update died
      # EACCES on its .staging dir. /private is the engine's own volume.
      ONTOLOGY_DATA_IO_DIR: /private/import/ontology
      # MEDIA IS SERVED OPENLY HERE, and since 2026-08-24 that is a property of
      # THIS STACK'S NGINX, not of the engine's mode. deploy/nginx.simple.conf
      # does not `include` the generated rule files, so nothing enforces a gate
      # no matter what mode the engine resolves — and the engine's default is now
      # fail-closed `publication`, so it WILL write those files and they WILL be
      # ignored here. Say it rather than imply it: an operator who needs
      # per-record media access control wants the full stack
      # (docker-compose.yml), whose nginx includes both files.
      #
      # TRUE whenever there is TLS — install.sh writes it into .dedalo.env
      # PAIRED with DEDALO_NGINX_CONF below, because a browser silently discards
      # a Secure cookie over http:// and every login appears to succeed and then
      # does nothing.
      #
      # THE DEFAULT FOLLOWS THE PROXY DEFAULT (OPS-04, fixed 2026-08-31). It used
      # to be `true` while DEDALO_NGINX_CONF defaulted to the PLAIN-HTTP
      # nginx.simple.conf — so this file's own header, 78 lines above, said "no
      # TLS — plain HTTP, so SESSION_COOKIE_SECURE must be false" and the file
      # then shipped the opposite. An operator who completed the install, chose a
      # root password and never passed --env-file could not log in, ever, with
      # nothing on screen to say why. The two defaults are one decision and must
      # move together; the gate that holds them together is
      # test/unit/compose_invocation_tripwire.test.ts.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DEDALO_ACCESS_LOG: "true"
      # THE DB OPS KEYS THE REFERENCE STACK ALREADY SETS (P2-33 / OPS-11).
      #
      # This stack omitted all three, landing museum operators on the unsafe side
      # of a decision the project had already made in docker-compose.yml. The
      # values are that stack's, verbatim, because there is no reason for the
      # museum install to be configured worse than the reference one:
      #   - DB_POOL_MAX bounds connections so a slow page cannot exhaust
      #     Postgres and lock everyone out;
      #   - DB_POOL_ACQUIRE_TIMEOUT_MS makes waiting for a connection FAIL rather
      #     than hang, so a saturated pool surfaces as an error, not a frozen UI;
      #   - DB_STATEMENT_TIMEOUT_MS stops one runaway query holding a table while
      #     a curator waits.
      DB_POOL_MAX: "10"
      DB_POOL_ACQUIRE_TIMEOUT_MS: "30000"
      DB_STATEMENT_TIMEOUT_MS: "60000"
      TRUSTED_PROXY_HOPS: "1"
      DEDALO_DEV_MODE: "false"
      DEDALO_DEBUG_API_ERRORS: "false"
      # The engine never serves media here — nginx does, from the shared volume.
      MEDIA_DEV_ROUTE_ENABLED: "false"
    volumes:
      - private:/private          # .env, sessions, ts_state.json, backups — SECRETS
      - media:/srv/dedalo/media   # written by the engine, READ by the proxy
      - socket:/run/dedalo        # the unix socket, shared with the proxy
      - client:/srv/dedalo/client # the published client, READ by the proxy
    healthcheck:
      # THE 503 GETS A CONSUMER (P2-33 / OPS-09).
      #
      # This used to be a bare `curl /health`, and under Compose a healthcheck
      # has exactly two consumers: start ordering, and the `(unhealthy)` string
      # in `docker ps`. Docker Engine never restarts an unhealthy container (only
      # Swarm does) and `restart: unless-stopped` above fires on process EXIT —
      # which a POISONED or WEDGED process never does, that being the whole point
      # of the poison latch. So the three failure modes the engine is hardened to
      # survive (poisoned process, wedged pool, database down) were permanent
      # here, while the engine's own log said "the watchdog must recycle this
      # process".
      #
      # scripts/ops/container_watchdog.sh runs the SAME probe and still exits
      # non-zero on red (so `docker ps` reads exactly as before), but it also
      # counts consecutive reds and, on the 3rd — matching `retries` below, which
      # a gate holds equal to the script's threshold — SIGTERMs PID 1: the engine
      # itself, which drains and exits, and `restart: unless-stopped` recycles
      # the container. No docker.sock handed to a container, no extra image.
      #
      # It escalates only AFTER a first green probe, so it is inert during a slow
      # boot and on an engine that refused to start (exit 78: not installed).
      #
      # CADENCE: 3 x 30s ≈ 90 s to a recycle here — NOT systemd's 30 s.
      test: ["CMD", "/opt/dedalo/master_dedalo/scripts/ops/container_watchdog.sh", "--socket", "/run/dedalo/dedalo_ts.sock"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- The reverse proxy -----------------------------------------------------
  # Owns TCP, serves the client statics, and serves the media tree OPENLY. It
  # `include`s no generated rule files, so unlike the full stack it starts
  # immediately and needs no post-install wiring step.
  nginx:
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    restart: unless-stopped
    depends_on:
      - dedalo
    ports:
      # 443 is published in every TLS mode; 80 stays published because it both
      # redirects to HTTPS and answers the ACME challenge at renewal time.
      # Bind to one interface (e.g. "127.0.0.1:443:443") if this machine has an
      # address you do not want it answering on.
      # The installer (`sh install.sh`, trial route) writes the ports it was given
      # into .dedalo.env; the defaults are the long-standing ones.
      - "${DEDALO_HTTP_PORT:-80}:80"
      - "${DEDALO_HTTPS_PORT:-443}:443"
    volumes:
      # install.sh writes deploy/nginx.simple.generated.conf from the TLS
      # template and points this variable at it. The default keeps a bare
      # `docker compose -f docker-compose.simple.yml up -d` working exactly as
      # before — plain HTTP, no certificate needed.
      - ./deploy/${DEDALO_NGINX_CONF:-nginx.simple.conf}:/etc/nginx/conf.d/default.conf:ro
      # The client the ENGINE published (never the checkout's): the alias in the
      # proxy configuration points into this mount.
      - client:/opt/dedalo/master_dedalo/client:ro
      - media:/srv/dedalo/media:ro
      - socket:/run/dedalo
      # Let's Encrypt material, shared with the certbot service.
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      # Local-CA and bring-your-own certificates. Not a volume: you may want to
      # replace these files by hand.
      - ./deploy/certs:/etc/dedalo/certs:ro
    # Renewed certificates only take effect on a reload, and certbot cannot
    # signal another container. Reloading every 6h is the standard answer: it
    # costs nothing and picks up a renewal within hours of it landing.
    # READS MEDIA THROUGH THE ENGINE'S GROUP. The engine runs as `bun` (uid/gid
    # 1000) under umask 0027 (Dockerfile ENTRYPOINT), so everything it writes into
    # the media volume is 640/750: owner + GROUP read, the world nothing. nginx's
    # workers are uid 101; without the group every media file written since the
    # umask was narrowed is a 403. Same model as systemd (UMask=0007 + the proxy
    # user in the `dedalo` group).
    # The membership goes into the container's /etc/group, NOT `group_add`:
    # group_add reaches only PID 1 (the root master, which opens no files), and
    # each worker's initgroups("nginx") REPLACES its supplementary groups with
    # /etc/group's (measured 2026-09-24: workers `Groups: 101`, a 640 file 403s).
    # Never "fix" it with chmod o+r: media turns world-readable and the next
    # upload is 403 again. Gate: test/unit/stack_ops_policy_tripwire.test.ts.
    command: >
      sh -c "addgroup -g 1000 dedalo 2>/dev/null; addgroup nginx dedalo 2>/dev/null; while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # --- Let's Encrypt renewal (profile `letsencrypt`) -------------------------
  # The FIRST certificate is obtained by install.sh with a one-off standalone
  # certbot run, before nginx exists to hold port 80. This service only RENEWS,
  # over the webroot the nginx config exposes at /.well-known/acme-challenge/ —
  # so renewal never needs to stop the proxy. install.sh enables the profile.
  certbot:
    image: certbot/certbot:v5.10.0@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d
    profiles: ["letsencrypt"]
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  # --- Nightly backup --------------------------------------------------------
  # THE STACK HAD NO BACKUP JOB AT ALL (P0-13, 2026-08-30). deploy/dedalo-backup.*
  # is a systemd unit, which a compose host does not run — so every containerised
  # install shipped with no scheduled copy of anything, while `private:` and
  # `media:` carried the comment "back this up" and nothing did.
  #
  # It runs the SAME scripts the systemd unit runs (bind-mounted: deploy/ is
  # deliberately absent from the image, see the Dockerfile's build-context
  # allowlist), so there is one implementation of "what a backup is" and not two.
  #
  # THREE OF THE FIVE STORES OF engineering/PRODUCTION.md §6 EXIST HERE: the matrix
  # DB (1), the media originals (3) and /private (4). Store 2 (RAG) lives in the
  # `rag` profile — add a fourth step for it, like the unit's commented line, if you
  # enable it; store 5 (site-builder instances) is not part of this stack.
  #
  # WHERE IT WRITES, AND WHAT THAT IS WORTH. Into the `backups` volume — i.e. onto
  # this same host, next to the data. That is a real restore point for the failures
  # that actually happen most (a bad import, a deleted record, a truncated dump) and
  # NO PROTECTION AT ALL against losing the machine or the disk. Copy the volume off
  # this host on a schedule you control; nothing in a single-host compose file can
  # do that for you, and a backup that never leaves the machine it protects is half
  # a backup.
  #
  # HOW YOU KNOW IT WORKED: `docker compose ps` marks this service UNHEALTHY while
  # /backups/BACKUP_FAILED exists — the marker the run writes when any store fails
  # and removes when every store succeeds. That file, and /backups/LAST_OK, are the
  # two things to look at.
  backup:
    # The SAME image as the engine — one pinned name, one version (see the dedalo
    # service); the build override builds it once, for both.
    image: ${DEDALO_IMAGE:-localhost/dedalo}:${DEDALO_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The database this stack created. If you told the installer a DIFFERENT
      # database or role than these, correct them here — the backup connects on its
      # own and cannot ask the engine what it chose.
      DB_NAME: ${POSTGRES_DB:-dedalo}
      DB_USER: ${POSTGRES_USER:-dedalo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dedalo}
      DB_HOST: postgres
      # Same media root the engine and the proxy use, mounted read-only below.
      MEDIA_PATH: /srv/dedalo/media
      DEDALO_BACKUP_STATE_DIR: /backups
      # How many dated generations of the media originals and of /private to keep.
      # A one-generation mirror propagates a mass deletion within a day; these are
      # hard-linked, so a fortnight of them costs about one copy plus the changes.
      DEDALO_BACKUP_KEEP: "14"
    volumes:
      - ./deploy:/opt/dedalo/master_dedalo/deploy:ro
      - private:/private:ro
      - media:/srv/dedalo/media:ro
      - backups:/backups
    # One run a day, the first one an hour after start. `sleep & wait` (not a bare
    # sleep) is the certbot renewal loop's shape: with the TERM trap below it
    # lets SIGTERM stop the container promptly instead of waiting out the sleep.
    entrypoint:
      - /bin/sh
      - -c
      - |
        # NO `set -e`: a store that fails must not stop the next one, nor kill the
        # loop. The run's verdict is /backups/BACKUP_FAILED (written by the last
        # step, removed when every store succeeded) and the healthcheck reads it.
        set -u
        # PID 1 IGNORES A SIGNAL IT HAS NO HANDLER FOR: without this trap `compose
        # stop` waits out its timeout and kills the container (exit 137). The trap
        # ends the loop at once (the `sleep & wait` below returns on the signal).
        trap 'exit 0' TERM INT
        D=/opt/dedalo/master_dedalo/deploy
        export DEDALO_BACKUP_STATUS_DIR=/tmp/dedalo-backup-status
        # Which stores this loop promises. Without it the aggregate can only see
        # the stores that RECORDED a status, so a step that never ran at all is
        # invisible and a partial run reports success (see dedalo-backup-step.sh).
        export DEDALO_BACKUP_EXPECTED_STORES="matrix_db media private"
        sleep 3600 & wait $${!}
        while :; do
          rm -rf "$$DEDALO_BACKUP_STATUS_DIR"
          "$$D/dedalo-backup-step.sh" run matrix_db \
            "$$D/dedalo-db-backup.sh" --label compose --dir /backups/db \
            --db-key DB_NAME --host-key DB_HOST --port-key DB_PORT \
            --user-key DB_USER --password-key DB_PASSWORD \
            --pg-dump pg_dump --pg-restore pg_restore
          "$$D/dedalo-backup-step.sh" run media \
            "$$D/dedalo-tree-backup.sh" --label media --source-key MEDIA_PATH \
            --dest /backups/media --keep "$$DEDALO_BACKUP_KEEP"
          # /export_artifacts: tool_export's temporary, owner-only files (TTL-swept,
          # access re-checked on every download) — never kept in a generation.
          "$$D/dedalo-backup-step.sh" run --last private \
            "$$D/dedalo-tree-backup.sh" --label private --source /private/ \
            --dest /backups/private --keep "$$DEDALO_BACKUP_KEEP" \
            --exclude /export_artifacts
          sleep 86400 & wait $${!}
        done
    healthcheck:
      # UNHEALTHY while the last run left a failure marker. This is the whole
      # notification mechanism a compose host gets: there is no systemd OnFailure=
      # here, so the state has to be visible in `docker compose ps`.
      #
      # AND unhealthy while /backups is not writable. The marker is written INTO
      # /backups, so a volume this user cannot write is the one failure the marker
      # can never report: every store fails, the marker write fails too, and a
      # marker-only probe stays HEALTHY over a stack that has never taken a backup
      # (measured 2026-10-08 — the volume came up root-owned for five weeks).
      test: ["CMD-SHELL", "test -w /backups && test ! -e /backups/BACKUP_FAILED"]
      interval: 300s
      timeout: 5s
      retries: 1
      start_period: 60s

volumes:
  pgdata:
  private:      # SECRETS — back this up
  media:        # the originals are the source of truth — back this up
  socket:
  backups:      # the nightly copies — SEE THE backup SERVICE: copy this OFF this host
  client:       # DERIVED — the engine republishes it on every start; never back it up
  letsencrypt:  # issued certificates + the ACME account key
  certbot_www:  # the challenge webroot, shared with nginx
