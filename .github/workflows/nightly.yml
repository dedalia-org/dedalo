# NIGHTLY — the TIME-BASED checks, on the one event where time IS the input.
#
# WHY THIS EXISTS (2026-09-26). Three inputs of the dependency-audit ratchet change
# with the CALENDAR, not with a commit: the `bun audit` registry, the GitHub
# advisory feed, and the review windows / acceptance expiries of the vendored trees
# (vendor/vendor_manifest.json). On the push gate they made the same sha green on
# Monday and red on Tuesday, and the red landed on whoever pushed next — for code
# they had not touched. That is a gate doing its job on the wrong event. So:
#   - the PUSH gate (scripts/ci/hermetic.sh) runs scripts/ci/audit.ts only when the
#     push changed what it reads (a bun.lock, a package.json, vendor/, a manifest
#     root, the audit's own inputs) — `--changed-since <base>`, the base covering every
#     commit the push carries (its `before`; hermetic.sh audit_reference); and runs the vendor
#     tripwire's tree-only legs on every push (DEDALO_VENDOR_DATED_CHECKS=0);
#   - THIS workflow runs the whole thing every night, calendar ON, `--force`, and
#     keeps ONE open issue labelled `ci-nightly` saying what is red — or what is about
#     to be: a review window or acceptance closing within 21 days is a WARNING here
#     (VENDOR_WINDOW_WARNING_DAYS in scripts/vendor_verify.ts), never a red. Red is
#     "already closed" / "a new advisory nobody triaged", and it makes this run red.
#   - green with no warnings CLOSES the issue.
# The DEC-12 ratchet itself (what is red, what `--update` refuses) is unchanged.
#
# The vendor advisory/expiry check IS scripts/ci/audit.ts here: it calls the same
# checker test/unit/vendor_advisory_tripwire.test.ts asserts (checkVendorAdvisories,
# calendar ON) plus the networked feed, so a second `bun test` would re-prove the
# same function with a test preload that needs the whole config stubbed.
#
# LEAST PRIVILEGE, SPLIT BY JOB. `check` runs repository code (bun, the audit) with a
# read-only token. `report` holds the only write scope in this file — `issues:
# write` — and runs NO repository code: no checkout, no bun, only `gh` over the
# JSON verdict `check` handed it. Everything it reads crosses through `env:`, never
# through `${{ }}` inside a script (rule 7d of test/unit/ci_workflow_tripwire.test.ts,
# which also pins this file's shape — rule 17).
#
# NOT a tier: this file runs no `bash scripts/ci/*.sh`, so the tier laws of
# test/unit/tier_wiring_tripwire.test.ts (fire on every PR and push, no `if:`) do
# not apply — a schedule is exactly the event a tier must never be limited to, and
# exactly the one this job is for.
#
# THE FULL GATE OF THE INTERNAL REMOTE (2026-10-10, job `full_gate`). Pushes to the
# internal day-to-day remote (gitdedalo) are gated HERMETIC-ONLY at the desk
# (scripts/hooks/pre-push, "THE GATE IS PER REMOTE"): the full gate (~46 min) on every
# push was not viable. That downgrade is honest only because THIS job runs the full gate
# — the very command the hook runs for a public push, `bun run ci:local --docker
# --hermetic --db --instance --ref <sha>`, in the locked CI image — every night on the
# tip of gitdedalo/master, and a red lands in the ci-nightly issue below with that sha
# (ci_workflow_tripwire rule 20 pairs the hook's downgrade with this job). gitdedalo is
# reached over SSH with a READ-ONLY deploy key and a PINNED host key (both secrets,
# never `ssh-keyscan`: trust-on-first-use would hand the run to whoever answers the
# address); the key file lives only inside the fetch step. Without the secrets the job
# SKIPS LOUDLY: an error annotation and a warning in the issue, never a quiet green.
# Runbook (creating the key, the environment, the host-key secret): engineering/CI.md,
# *The nightly full gate*. The `--audit-base <sha>` makes the push gate's audit skip
# (no range): the dependency audit is `check`'s job, forced, every night.
#
# PUBLIC-REPO POSTURE: ubuntu-latest, no self-hosted runner, the token is the run's own
# `github.token`. ONE job holds secrets — `full_gate`, bound to the
# `gitdedalo-nightly` environment (deployment branches: master only), and only the three
# GITDEDALO_* names; this file has no push / pull_request / workflow_run trigger
# (rule 11's second carve-out holds exactly that). A fork gets no schedule and cannot
# dispatch. NOTE: the job log is public — it shows the gated sha and test names of
# gitdedalo/master, never its secrets.
name: nightly

on:
  schedule:
    # Daily 04:17 UTC — off the top of the hour, when GitHub's scheduler is least
    # congested. GitHub pauses schedules after ~60 days of repo inactivity.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      warn_days:
        description: "Warning lead time in days before a vendor window closes (blank = the script's default, 21). Raise it to rehearse the issue."
        required: false
        default: ""

# The default for every job: read the tree, write nothing. `report` widens ONLY
# itself, to issues: write. Enforced by rules 7 and 17 of ci_workflow_tripwire.
permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      rc: ${{ steps.audit.outputs.rc }}
      verdict: ${{ steps.audit.outputs.verdict }}
      summary: ${{ steps.audit.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version # the load-bearing pin — never inline a version
      # No `bun install`: `bun audit` reads bun.lock, and audit.ts imports only repo
      # modules and bun builtins (measured on a fresh clone with no node_modules).
      #
      # --force            run regardless of what changed (the push gate's skip does not apply);
      # --require-network  a degraded feed lookup is RED here: this run IS the discovery the
      #                    push gate defers to, so "the feed did not answer" must not pass;
      # --summary          the verdict as JSON on every exit path, for `report`.
      - name: Dependency + vendor advisory audit (calendar ON, forced)
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WARN_DAYS: ${{ inputs.warn_days }}
        run: |
          summary="$RUNNER_TEMP/audit.json"
          extra=()
          if [ -n "${WARN_DAYS:-}" ]; then extra+=(--warn-days "$WARN_DAYS"); fi
          # The rc is CARRIED, not swallowed: written below, and the next step exits with it.
          rc=0
          bun run scripts/ci/audit.ts --force --require-network --summary "$summary" "${extra[@]}" || rc=$?
          if [ ! -s "$summary" ]; then
            jq -n --arg rc "$rc" '{tool: "scripts/ci/audit.ts", verdict: "red", problems: ["audit.ts exited \($rc) without writing its summary — read the log of this step"], warnings: [], notes: []}' > "$summary"
          fi
          {
            echo "rc=$rc"
            echo "verdict=$(jq -r '.verdict' "$summary")"
            echo "summary=$(jq -c '.' "$summary")"
          } >> "$GITHUB_OUTPUT"
      - name: Fail the run when the audit is red
        env:
          RC: ${{ steps.audit.outputs.rc }}
        run: exit "$RC"

  report:
    needs: [check, image_pin, cosign_pin, full_gate]
    # always(): a red `check` is exactly when the issue matters. A cancelled or
    # skipped `check` reports nothing (handled in the script, not here, so the
    # condition cannot silently drop a red).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the ci-nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECK_RESULT: ${{ needs.check.result }}
          SUMMARY: ${{ needs.check.outputs.summary }}
          PIN_RESULT: ${{ needs.image_pin.result }}
          PIN_MESSAGE: ${{ needs.image_pin.outputs.message }}
          COSIGN_RESULT: ${{ needs.cosign_pin.result }}
          COSIGN_MESSAGE: ${{ needs.cosign_pin.outputs.message }}
          FULL_RESULT: ${{ needs.full_gate.result }}
          FULL_STATE: ${{ needs.full_gate.outputs.state }}
          FULL_REASON: ${{ needs.full_gate.outputs.reason }}
          FULL_SHA: ${{ needs.full_gate.outputs.sha }}
          FULL_REDS: ${{ needs.full_gate.outputs.reds }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="ci-nightly"
          case "$CHECK_RESULT" in
            success|failure) ;;
            *) echo "check was ${CHECK_RESULT}: nothing measured, nothing reported"; exit 0 ;;
          esac
          # NOT `${SUMMARY:-{...}}`: a `}` inside the default terminates the expansion
          # (the trap scripts/ci/hermetic.sh documents for its JSON stubs).
          if [ -z "${SUMMARY:-}" ]; then
            SUMMARY='{"verdict":"red","problems":["the check job produced no summary (it died before the audit step) — read its log"],"warnings":[],"notes":[]}'
          fi
          # The CI image pin (image_pin job) is one more time-based check: a red one is a
          # problem in this issue, not only a red scheduled run nobody is notified of.
          if [ "${PIN_RESULT:-}" = "failure" ]; then
            SUMMARY="$(jq --arg m "CI image pin is behind: ${PIN_MESSAGE:-read the image_pin job log} — run \`bun run ci:image:pin\` and commit the diff" '.problems = ((.problems // []) + [$m]) | .verdict = "red"' <<<"$SUMMARY")"
          fi
          # The cosign pin (cosign_pin job): image-release.yml refuses to publish while it is
          # unset, and signs with a stale tool while it is behind — either way a problem here.
          if [ "${COSIGN_RESULT:-}" = "failure" ]; then
            SUMMARY="$(jq --arg m "cosign pin is unset or behind: ${COSIGN_MESSAGE:-read the cosign_pin job log} — run \`bun run ci:cosign:pin\` and commit the diff" '.problems = ((.problems // []) + [$m]) | .verdict = "red"' <<<"$SUMMARY")"
          fi
          # The FULL GATE of gitdedalo/master (full_gate job): red → a problem naming the sha
          # and every red stage; not run (secrets absent) → a WARNING, loud but not red.
          if [ "${FULL_STATE:-}" = "skipped" ]; then
            SUMMARY="$(jq --arg m "full gate of gitdedalo/master NOT RUN: ${FULL_REASON:-no reason recorded}" '.warnings = ((.warnings // []) + [$m])' <<<"$SUMMARY")"
          elif [ "${FULL_RESULT:-}" != "success" ]; then
            reds="${FULL_REDS:-}"
            [ -n "$reds" ] || reds='[]'
            SUMMARY="$(jq --arg m "FULL GATE (hermetic + db + instance) is ${FULL_RESULT:-unknown} on gitdedalo/master ${FULL_SHA:-<sha unknown — the fetch did not complete>}${FULL_REASON:+: $FULL_REASON} — reproduce: git fetch gitdedalo master && bun run ci:local --docker --hermetic --db --instance --ref ${FULL_SHA:-gitdedalo/master}" --argjson reds "$reds" '.problems = ((.problems // []) + [$m] + ($reds | map("  ✗ " + .))) | .verdict = "red"' <<<"$SUMMARY")"
          fi
          verdict="$(jq -r '.verdict // "red"' <<<"$SUMMARY")"
          problems="$(jq '.problems // [] | length' <<<"$SUMMARY")"
          warnings="$(jq '.warnings // [] | length' <<<"$SUMMARY")"
          if [ "$CHECK_RESULT" = "failure" ] || [ "$verdict" = "red" ] || [ "$problems" -gt 0 ]; then
            state="RED"
          elif [ "$warnings" -gt 0 ]; then
            state="WARNING"
          else
            state="GREEN"
          fi
          echo "nightly state: $state (problems $problems, warnings $warnings)"

          gh label create "$label" --color B60205 \
            --description "Opened, updated and closed by .github/workflows/nightly.yml" --force >/dev/null
          number="$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')"

          if [ "$state" = "GREEN" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Nightly time-based checks are GREEN with no warnings: $RUN_URL"
            fi
            exit 0
          fi

          body="$RUNNER_TEMP/issue.md"
          {
            echo "## Nightly time-based checks: $state"
            echo
            echo "Run: $RUN_URL"
            echo
            echo "What runs here: \`bun run scripts/ci/audit.ts --force --require-network\` — the \`bun audit\` ratchet"
            echo "against engineering/dependency_audit_baseline.json, the vendored trees' advisory ledger and review /"
            echo "acceptance windows (calendar ON), and the GitHub advisory feed. The push gate skips these unless a push"
            echo "changes a lockfile, a package.json or vendor/, so this issue is where they surface."
            echo
            echo "Also here: the FULL GATE (hermetic + db + instance, \`bun run ci:local --docker\`) of the internal"
            echo "remote's master (gitdedalo), whose pushes are gated hermetic-only at the desk — sha: ${FULL_SHA:-not fetched}."
            echo
            if [ "$problems" -gt 0 ]; then
              echo "### Red"
              echo
              jq -r '.problems[] | "~~~text\n" + . + "\n~~~\n"' <<<"$SUMMARY"
            fi
            if [ "$warnings" -gt 0 ]; then
              echo "### Warnings — a window closes within $(jq -r '.warn_days // 21' <<<"$SUMMARY") days (not red until it has closed)"
              echo
              jq -r '.warnings[] | "- " + .' <<<"$SUMMARY"
              echo
            fi
            if [ "$(jq '.notes // [] | length' <<<"$SUMMARY")" -gt 0 ]; then
              echo "### Notes"
              echo
              jq -r '.notes[] | "- " + .' <<<"$SUMMARY"
              echo
            fi
            echo "---"
            echo "This issue is kept by .github/workflows/nightly.yml: updated while anything is red or close, closed on the first green night."
          } > "$body"

          title="ci-nightly: $state — time-based checks + gitdedalo full gate"
          if [ -n "$number" ]; then
            previous="$(gh issue view "$number" --json title --jq '.title')"
            gh issue edit "$number" --title "$title" --body-file "$body"
            if [ "$previous" != "$title" ]; then
              gh issue comment "$number" --body "State changed to $state: $RUN_URL"
            fi
          else
            gh issue create --title "$title" --label "$label" --body-file "$body"
          fi

  # THE CI IMAGE PIN'S UPDATER SIGNAL (scripts/lib/ci_image.ts). ci-image.yml rebuilds the
  # image weekly with the layer cache OFF to take distro security fixes — under the SAME
  # fingerprint, so nothing else notices a new digest was published. Red here means the
  # lock still pins the older build: run `bun run ci:image:pin` and commit the diff.
  image_pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      message: ${{ steps.pin.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version # the load-bearing pin — never inline a version
      - name: The CI image pin is the latest published build of this definition
        id: pin
        run: |
          set +e
          bun run ci:image:pin --check > "$RUNNER_TEMP/pin.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/pin.log"
          echo "message=$(grep '^ci:image:pin:' "$RUNNER_TEMP/pin.log" | tail -1 | tr -d '\r')" >> "$GITHUB_OUTPUT"
          exit "$rc"

  # THE COSIGN PIN'S UPDATER SIGNAL (scripts/ci_cosign_pin.ts, ci/cosign.json). The release
  # workflow (image-release.yml) downloads exactly the pinned cosign to sign and verify every
  # published image, and refuses to publish while the pin is unset. Red here means the pin
  # is unset or a newer stable cosign exists: run `bun run ci:cosign:pin` and commit the diff.
  # The token only lifts the API's anonymous rate limit; it is the run's own, read-only.
  cosign_pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      message: ${{ steps.pin.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version # the load-bearing pin — never inline a version
      - name: The cosign pin is set and is the latest stable release
        id: pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          bun run ci:cosign:pin --check > "$RUNNER_TEMP/cosign_pin.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/cosign_pin.log"
          echo "message=$(grep '^ci:cosign:pin:' "$RUNNER_TEMP/cosign_pin.log" | tail -1 | tr -d '\r')" >> "$GITHUB_OUTPUT"
          exit "$rc"

  # THE FULL GATE OF gitdedalo/master — see the header. Its red is carried to this run's
  # verdict (the last step's exit) and into the ci-nightly issue (report).
  full_gate:
    runs-on: ubuntu-latest
    # ~46 min on a developer Mac; a hosted runner is slower, and the instance tier is long.
    timeout-minutes: 300
    # The ONE job that may read the GITDEDALO_* secrets (rule 11's second carve-out). Owner
    # setup: environment `gitdedalo-nightly`, deployment branches = master only, its three
    # secrets stored there (engineering/CI.md, The nightly full gate).
    environment: gitdedalo-nightly
    outputs:
      state: ${{ steps.fetch.outputs.state }}
      reason: ${{ steps.fetch.outputs.reason }}
      sha: ${{ steps.fetch.outputs.sha }}
      rc: ${{ steps.gate.outputs.rc }}
      reds: ${{ steps.gate.outputs.reds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitdedalo/master shares this history: the fetch below is incremental
          persist-credentials: false # the gated code runs next; it gets no token in .git/config
      # The key never leaves this step: written under $RUNNER_TEMP, removed on exit. The host
      # key is the PINNED line from the secret — StrictHostKeyChecking=yes, no global file,
      # no ssh-keyscan. Secrets absent → state=skipped with the names, exit 0 (loud: an
      # error annotation here, a warning in the issue).
      - name: Fetch gitdedalo master (read-only deploy key, pinned host key)
        id: fetch
        env:
          GITDEDALO_DEPLOY_KEY: ${{ secrets.GITDEDALO_DEPLOY_KEY }}
          GITDEDALO_KNOWN_HOSTS: ${{ secrets.GITDEDALO_KNOWN_HOSTS }}
          GITDEDALO_URL: ${{ secrets.GITDEDALO_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${GITDEDALO_DEPLOY_KEY:-}" ] || missing+=(GITDEDALO_DEPLOY_KEY)
          [ -n "${GITDEDALO_KNOWN_HOSTS:-}" ] || missing+=(GITDEDALO_KNOWN_HOSTS)
          [ -n "${GITDEDALO_URL:-}" ] || missing+=(GITDEDALO_URL)
          if [ "${#missing[@]}" -gt 0 ]; then
            reason="secret(s) absent: ${missing[*]} — set them in the gitdedalo-nightly environment (engineering/CI.md, The nightly full gate)"
            echo "::error title=full gate NOT RUN::$reason"
            { echo "state=skipped"; echo "reason=$reason"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ssh_dir="$RUNNER_TEMP/gitdedalo-ssh"
          mkdir -m 700 "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$GITDEDALO_DEPLOY_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$GITDEDALO_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -F /dev/null -i $ssh_dir/key -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no"
          if ! git fetch --no-tags --quiet "$GITDEDALO_URL" "+refs/heads/master:refs/remotes/gitdedalo/master"; then
            reason="could not fetch gitdedalo master (deploy key refused, host key mismatch, or host down) — read this step's log"
            echo "::error title=full gate NOT RUN::$reason"
            { echo "state=failed"; echo "reason=$reason"; } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          sha="$(git rev-parse --verify 'refs/remotes/gitdedalo/master^{commit}')"
          git checkout --quiet --detach "$sha"
          echo "== full gate: gitdedalo/master = $sha"
          { echo "state=ran"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
      # From here on the checkout IS the gated commit: its .bun-version, its ci:local, its image pin.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.fetch.outputs.state == 'ran'
        with:
          bun-version-file: .bun-version # the load-bearing pin — never inline a version
      - name: Full gate of gitdedalo/master (hermetic + db + instance, in the CI image)
        id: gate
        if: steps.fetch.outputs.state == 'ran'
        env:
          SHA: ${{ steps.fetch.outputs.sha }}
        run: |
          summary="$RUNNER_TEMP/full_gate.json"
          # The rc is CARRIED, not swallowed: written below, and the next step exits with it.
          rc=0
          bun run ci:local --docker --hermetic --db --instance --ref "$SHA" --audit-base "$SHA" --summary "$summary" || rc=$?
          reds='[]'
          if [ -s "$summary" ]; then
            reds="$(jq -c '[.tiers[]? | .tier as $t | .stages[]? | select(.verdict == "red") | "\($t) › \(.name)" + (if .fix_hint then " — \(.fix_hint)" else "" end)]' "$summary")"
          fi
          { echo "rc=$rc"; echo "reds=$reds"; } >> "$GITHUB_OUTPUT"
      - name: Fail the run when the full gate is red
        if: steps.fetch.outputs.state == 'ran'
        env:
          RC: ${{ steps.gate.outputs.rc }}
        run: exit "$RC"
