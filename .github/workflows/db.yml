# DB TIER — the gates that need a live Postgres, on a HOSTED runner.
#
# WHAT THIS CLOSES. The DB tier existed only in .github/workflows-selfhosted/,
# which GitHub does not execute, so its nightly cron has never fired. Measured
# 2026-08-24: 19 tripwires ran on NO executing tier while every gate the repo
# owns reported green. This workflow runs them on every PR.
#
# FORK SAFETY IS THE WHOLE DESIGN. dedalia-org/dedalo is PUBLIC and anyone may open
# a PR, which is exactly why the DB tier could never be self-hosted (rule 5 of
# test/unit/ci_workflow_tripwire.test.ts: that would be RCE on the machine
# holding ../private/.env and the live matrix Postgres). Here a fork PR gets its
# own empty, throwaway Postgres service container and NOTHING else: this file
# references no repository secret at all, and the tripwire asserts that.
#
# (Rule 11 matches the EXPRESSION form, so prose like this sentence is fine —
# unlike rule 1, whose whole-file substring match makes a mere mention read as a
# use. docs.yml:18-20 records that trap.)
#
# The database is BUILT, not restored: scripts/test_db_setup.ts installs a
# complete Dedalo from bytes vendored in this repo (install/db/*.pgsql.gz, the
# hierarchy copies, the generic `test` TLD ontology) and stamps the
# dedalo_test_marker row every test-data writer demands. Nothing here reads an
# installation's data, because there is no installation on this runner.
#
# TWO TIER JOBS, ONE SERVICE SHAPE (2026-09-02, P0-1 residual; plus the light `dedupe`
# gate of 2026-09-26, see CONCURRENCY below). `db` runs the in-process
# gates; `instance` runs the gates that BOOT A REAL SERVER over the wire — the
# browser client suite and the two code-update drills (scripts/ci/instance_tier.sh).
# Those three commands were invoked only from .github/workflows-selfhosted/, which
# GitHub does not execute on a public repo, so they ran on NO CI. A second job
# rather than two more stages of db_tier.sh because the instance gates need a
# FRESH suite database: the db job's 725-file unit stage pollutes the fixture the
# client baseline was measured on. Each job gets its own service container, so
# the isolation is structural. The service block is repeated verbatim — GitHub
# Actions has no YAML anchors — and rule 12 digest-pins both copies.
#
# Invariants in this file are enforced by test/unit/ci_workflow_tripwire.test.ts
# and test/unit/tier_wiring_tripwire.test.ts.

name: db

# TRIGGERS — same reasoning as ci.yml, and the same measured consequence: a tier
# that does not run on the branch work lands on reports NOTHING. The `master`
# push trigger never fired here, because development happens directly on `v7`
# and only reaches master at a merge; the DB gates therefore ran only when a PR
# existed (P0-1 of the 2026-08-26 deep audit). This tier matters most for the
# branch fix: it is the one that runs the 725-file unit tier and the parity
# tier, so before this change those two executed on no CI at all.
# workflow_dispatch stays: the tier is expensive (~15 min suite build) and is
# occasionally worth firing by hand off any ref.
on:
  pull_request:
  push:
    branches: [master, v7]
  workflow_dispatch:

# Rule 7: every workflow declares its token scope at the top level. Read-only is
# all a test tier can possibly need.
permissions:
  contents: read

# CONCURRENCY + DEDUPE — the same design as ci.yml (read its block): a push run is
# grouped by SHA and never cancelled, so the second landing branch's run of the same
# sha queues, then `dedupe` skips `db` and `instance` iff a push run of this workflow
# on another branch concluded success for it. A workflow_dispatch run is keyed by its
# own run id (never grouped with, so never evicting, a queued push run) and never
# skips: a human asked for it. Pull requests: grouped by ref, superseded runs
# cancelled, never skipped. A failed dedupe runs the tiers (`!cancelled()`, not the
# implicit success()). The dedupe job below is byte-identical to ci.yml's (rule 19).
concurrency:
  group: db-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reads the run list of this workflow (actions: read, the only scope it holds); runs
  # no repository code — no checkout. Fail-open: an API error means "run the tiers".
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.probe.outputs.skip }}
    steps:
      - name: Skip when another landing branch's push run already verified this sha
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          skip=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id') &&
              runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=100" \
                --jq '.workflow_runs[] | [.id, .head_sha, .event, .conclusion, .head_branch] | @tsv'); then
              while IFS=$'\t' read -r id sha event conclusion branch; do
                if [ "$sha" = "$GITHUB_SHA" ] && [ "$event" = push ] && [ "$conclusion" = success ] &&
                  [ "$branch" != "$GITHUB_REF_NAME" ]; then
                  skip=true
                  echo "::notice::run $id on $branch already verified $GITHUB_SHA; the tiers are skipped here"
                  break
                fi
              done <<< "$runs"
            else
              echo "::warning::could not list the runs of $GITHUB_SHA; running the tiers (fail-open)"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  db:
    needs: dedupe
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.dedupe.result != 'success' || needs.dedupe.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    # The suite build is the long pole by a wide margin: MEASURED end to end at
    # ~15 min on a warm developer Mac (2.27M hierarchy rows through two per-row
    # sync triggers deriving ~19.5M more), against ~6 s for the 19 gates. A
    # hosted runner is not faster than that Mac, so 20 would have been a coin
    # flip — 40 leaves real headroom while still catching a genuine hang.
    timeout-minutes: 40
    # THE CI IMAGE (ci/image.json — scripts/lib/ci_image.ts), the one ci:local and GitLab
    # run: bun = .bun-version, pg18 client, Chromium, media tools, git. As uid 1001, the
    # runner user that owns the mounted workspace — never root, which defeats the
    # uid/permission gates. ci_workflow_tripwire holds this digest equal to the lock.
    container:
      image: ghcr.io/dedalia-org/dedalo-ci@sha256:24295d498923e0403b36409e4ad4ba961bd6f8d534463bc9c2db0bc81f70f759
      options: --user 1001 --shm-size 1g
    # In a container job a service is reached by its NAME, not localhost (the tier
    # scripts default DB_HOST to 127.0.0.1 — hosted_env.sh — and honour this).
    env:
      DB_HOST: postgres

    services:
      postgres:
        # DIGEST-pinned, not a tag: a tag is mutable, and this container holds the
        # database every assertion below is made against. Same reason security.yml
        # digest-pins gitleaks. Mirrors docker-compose.yml's major (pg18).
        #
        # pgvector/pgvector, NOT library/postgres (2026-08-31). The engine's RAG
        # store is a pgvector database, and scripts/test_db_setup.ts builds it
        # ON THIS CONNECTION -- `install/db/rag_embeddings.sql` opens with
        # `CREATE EXTENSION IF NOT EXISTS vector`. Stock postgres:18 does not ship
        # the extension, so the tier died at the SUITE BUILD, before a single gate:
        #   PostgresError: extension "vector" is not available
        # That is why the db job had never once passed. It is invisible on a
        # developer box, where one Postgres carries pgvector and serves both
        # databases -- exactly the shape this image restores here.
        #
        # In PRODUCTION the two are separate services (docker-compose.yml: the app
        # on postgres:18, the RAG store on pgvector/pgvector:pg18). Collapsing them
        # onto one server is a property of the TEST fixture, not of the deployment:
        # the suite derives `<suite db>_rag` from its own connection, and giving CI
        # a second service would have to change that derivation to prove nothing.
        image: pgvector/pgvector@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11 # pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # Without a health gate the first psql races the server's own init.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: DB tier (build the suite database + the DB-backed tripwires)
        run: bash scripts/ci/db_tier.sh

  instance:
    needs: dedupe
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.dedupe.result != 'success' || needs.dedupe.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    # The suite build (~15 min, see `db`) plus the browser suite (133 suites) and
    # two update drills (~3-5 min each warm). 60 is the first pin, from the db
    # job's measured build plus the drills' documented runtimes — MEASURE the first
    # green run and re-pin from that, never from a guess.
    timeout-minutes: 60
    # THE CI IMAGE (ci/image.json — scripts/lib/ci_image.ts), the one ci:local and GitLab
    # run: bun = .bun-version, pg18 client, Chromium, media tools, git. As uid 1001, the
    # runner user that owns the mounted workspace — never root, which defeats the
    # uid/permission gates. ci_workflow_tripwire holds this digest equal to the lock.
    container:
      image: ghcr.io/dedalia-org/dedalo-ci@sha256:24295d498923e0403b36409e4ad4ba961bd6f8d534463bc9c2db0bc81f70f759
      options: --user 1001 --shm-size 1g
    # In a container job a service is reached by its NAME, not localhost (the tier
    # scripts default DB_HOST to 127.0.0.1 — hosted_env.sh — and honour this).
    env:
      DB_HOST: postgres

    services:
      postgres:
        # The SAME digest as the `db` job above, with its reasons (pgvector, not
        # library/postgres; digest, not tag). Bump both copies in one change.
        image: pgvector/pgvector@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11 # pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # Without a health gate the first psql races the server's own init.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The update drills `git clone` THIS checkout as the release build's
          # source, and git refuses to clone a shallow repository.
          fetch-depth: 0

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # The image's Chromium (PUPPETEER_EXECUTABLE_PATH) runs the client suite; the
      # drills need zip/unzip/zipinfo and git. This step only makes the absence of
      # any of them a named failure instead of a mystery.
      - name: Image toolchain (Chromium, zip, git)
        run: |
          "$PUPPETEER_EXECUTABLE_PATH" --version
          zip -v | head -1
          zipinfo -h >/dev/null 2>&1 || unzip -v | head -1
          git --version

      - name: Instance tier (build the suite database + client suite + update drills)
        run: bash scripts/ci/instance_tier.sh
