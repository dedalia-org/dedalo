# Dependabot — the supply side of the dependency ratchet (scripts/ci/audit.ts).
#
# The ratchet tells us when a NEW advisory lands on what we already ship; Dependabot is
# what makes the fix arrive as a reviewable PR instead of a chore nobody schedules. The
# two are complementary: without the ratchet an update PR is optional forever; without
# the updates the ratchet's baseline only ever grows.
#
# ONE bun ECOSYSTEM PER PACKAGE WE RUN — the root engine and every isolated publication
# daemon (site_builder, server_api/v2, host_agent). Dependabot does not discover them; a
# directory left out of this file is a lockfile nobody updates (the same shape of hole that
# left publication/server_api/v2 out of CI until 2026-08-03). Held, not described:
# ci_workflow_tripwire rule 11b reds a derived daemon package with no entry here.
#
# `bun`, NOT `npm` (fixed 2026-08-25). These packages lock with `bun.lock`, which the
# npm ecosystem cannot write: every PR it opened rewrote `package.json` ALONE, and
# scripts/ci/hermetic.sh's first step is `bun install --frozen-lockfile`, so all four open
# dependency PRs (#82/#84/#85/#86) were red on arrival — "lockfile had changes, but
# lockfile is frozen". A proposal that cannot go green is not a proposal; the supply side
# was delivering nothing mergeable. The `bun` ecosystem updates manifest AND lockfile
# together. KNOWN COST, stated rather than discovered later: Dependabot does not do
# SECURITY updates for the bun ecosystem, only version updates. That axis stays where it
# already was — `scripts/ci/audit.ts` (the advisory ratchet, which fails the build on a
# new advisory) — and an npm-shaped security PR could not have passed CI anyway.
#
# `github-actions` is here because every `uses:` in .github/ is SHA-pinned (rule 8 of
# test/unit/ci_workflow_tripwire.test.ts). A pinned action never updates itself — the pin
# is a security property that would decay into "we run a two-year-old action" without
# something proposing the bumps. Dependabot rewrites the SHA and the trailing `# vN`.
version: 2

updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine noise; anything with a CVE still comes on its own.
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: bun
    directory: "/publication/server_api/v2"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: bun
    directory: "/publication/site_builder"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: bun
    directory: "/publication/host_agent"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # init + analyze are ONE dependency (init builds the database analyze
      # consumes); ungrouped, Dependabot splits them into two PRs that each
      # fail ci_workflow_tripwire's same-SHA leg.
      codeql-action:
        patterns: ["github/codeql-action*"]

  # The documentation toolchain (docs/requirements.txt — mkdocs, mkdocs-material,
  # pymdown-extensions, mkdocs-redirects, mkdocs-awesome-pages-plugin). Exactly the case this file's header
  # describes: the pins are exact so a local build and CI cannot drift, which
  # makes them a lockfile nobody updates unless something proposes the bumps.
  # It is also the toolchain that BUILDS what dedalo.dev serves, so leaving it
  # to rot is a security surface on a public site, not just staleness.
  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  # THE PRODUCT IMAGE'S BASE (Dockerfile `FROM oven/bun:<v>-debian@sha256:…`). The digest
  # pin is exactness — the published Dédalo images are SIGNED, and a signature over a base
  # that moved under an unchanged tag would vouch for bytes nobody chose — and this entry
  # is its updater: it proposes digest refreshes of the same tag and tag bumps. A TAG bump
  # PR is red until .bun-version moves with it (test/unit/ops_runtime_pin.test.ts holds the
  # Dockerfile tag == .bun-version): that is the lockstep the runtime pin needs, not noise.
  # Take it by moving .bun-version (and the CI image, which installs .bun-version) in the
  # same change.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # THE CI IMAGE'S BASE (ci/Dockerfile `FROM debian:trixie-slim@sha256:…`). The digest pin
  # is exactness; this is its updater — the same rule as the SHA-pinned actions above. A
  # merged bump changes the image fingerprint, which republishes ghcr.io/dedalia-org/dedalo-ci
  # (.github/workflows/ci-image.yml). Distro PACKAGES inside the image are refreshed by that
  # workflow's weekly no-cache rebuild, not here.
  - package-ecosystem: docker
    directory: "/ci"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # THE LOCAL-GATE STACK (ci/compose.yml: the CI image + the pgvector service). Dependabot
  # can only track an image written as `name:tag@sha256:…` — a bare `name@sha256:…` names
  # no tag to follow — so the compose file carries the tag.
  #
  # ONE DIGEST, ONE UPDATER — THE HAZARD THIS ENTRY CREATES. Dependabot does NOT update
  # `services:`/`container:` images inside .github/workflows/ (dependabot-core#5819, still
  # open), so while .github/workflows/db.yml ALSO spells the pgvector digest (its `db` and
  # `instance` services), this entry bumps ONE copy of a pin that must be the same bytes on
  # the runner and on the Mac — `ci:local` would then judge against a different Postgres
  # than the hosted tier, the exact drift the stack exists to remove. The structural answer
  # is a single source: the hosted jobs start pgvector FROM ci/compose.yml (the tiers are
  # moving into the CI image anyway), so this PR is the whole bump. Until then the copies
  # are held equal by a gate (test/unit/ci_workflow_tripwire.test.ts: every pgvector image
  # under .github/workflows/ == ci/compose.yml's digest), which turns this entry's PR red
  # until the workflow pins move with it in the same PR — a loud, one-line follow-up,
  # never a silent split.
  - package-ecosystem: docker-compose
    directory: "/ci"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
