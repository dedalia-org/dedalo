# SELF-HOSTED TIER — PRIVATE MIRROR ONLY. Never place this file (or any job with
# `runs-on: [self-hosted, …]`) under .github/workflows/ on the PUBLIC repo.
#
# Why this directory exists (2026-07-11): the repository (renderpci/dedalo then,
# dedalia-org/dedalo since 2026-10-09) went PUBLIC. GitHub only
# executes workflows under .github/workflows/, so everything here is INERT on the
# public repo — preserved, reviewed, and ready to be activated on a PRIVATE mirror
# that has the self-hosted runner attached.
#
# The danger being avoided: on a public repo anyone can fork and open a PR. A PR job
# with `runs-on: self-hosted` executes that fork's code on the Mac that holds the real
# ../private/.env and the live matrix Postgres with real Dédalo data. That is RCE on
# the data host. GitHub's own guidance is: do not use self-hosted runners with public
# repositories.
#
# These two jobs were lifted verbatim out of ci.yml (`verify`) and main.yml (`full`)
# when the public repo was stripped back to the hermetic tier.
#
# PRIVATE-MIRROR DUPLICATE (2026-09-02). Nothing here is the ONLY home of a gate
# any more: `verify`'s stages are twinned on the hosted tiers (typecheck, lint,
# lint:browser and site_builder in scripts/ci/hermetic.sh; the tripwires split
# hermetic ∪ db; the neighbours' directories claimed by the unit and parity tiers
# of scripts/ci/db_tier.sh), and `full`'s `bun test test/unit test/parity` IS
# those two tiers. test/unit/tier_wiring_tripwire.test.ts derives verify's stage
# list from scripts/verify.ts and holds every twin, so this file may lag the hosted
# workflows but can no longer hide an unrun gate.
#
# ORACLE NOTE (post-cutover): ORACLE_REQUIRED=1 is now largely VESTIGIAL. PHP is
# decommissioned and `oracleMode()` defaults to `fixtures`, so the live-oracle canary
# test is skipped and parity replays the frozen store credlessly. The flag is kept so
# that if anyone ever sets ORACLE_MODE=live, an absent oracle still hard-fails rather
# than silently skipping. The self-hosted tier's REAL remaining dependency is the
# sibling ../private tree scripts/ci/link_siblings.sh materializes — the one script
# a hosted runner cannot run (tier_wiring_tripwire SELF_HOSTED_ONLY). The old
# claims that unit tests "read real records" and that the PHP tree supplies
# client/dedalo/lib are both stale: the suite builds its own database from vendored
# bytes, and the client libs come from bun install + vendor/.
name: selfhosted

on:
  workflow_dispatch:
  # On the private mirror, restore the real triggers:
  #   pull_request:            # for `verify`
  #   push: { branches: [master] }   # for `full`

# Least privilege for GITHUB_TOKEN: without this block a workflow inherits the
# REPOSITORY default, which on an older repo is read/WRITE on contents, packages,
# issues and pull-requests — ambient push rights handed to every step, including a
# third-party action. None of these jobs writes anything back to the repo.
# Enforced by rule 7 of test/unit/ci_workflow_tripwire.test.ts.
permissions:
  contents: read

concurrency:
  group: selfhosted
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, macOS, dedalo-mac]
    timeout-minutes: 30
    env:
      ORACLE_REQUIRED: "1"
      DIFFUSION_JOBS_TABLE: dedalo_ts_test_ci_diffusion_jobs
      DIFFUSION_ACTIVITY_TABLE: dedalo_ts_test_ci_activity_diffusion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verify.ts needs the merge-base vs origin/master
      - name: Link sibling paths (../private, PHP tree, client lib)
        run: bash scripts/ci/link_siblings.sh
      - name: Runner preconditions (bun pin, env, service probes)
        run: bash scripts/ci/env_guard.sh
      - name: Install
        run: bun install --frozen-lockfile
      - name: Verify branch vs origin/master
        shell: bash # explicit: enables pipefail so tee cannot mask a red exit
        run: bun run scripts/verify.ts --base origin/master 2>&1 | tee verify.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: verify-log
          path: verify.log

  full:
    runs-on: [self-hosted, macOS, dedalo-mac]
    timeout-minutes: 60
    env:
      ORACLE_REQUIRED: "1"
      DIFFUSION_JOBS_TABLE: dedalo_ts_test_ci_diffusion_jobs
      DIFFUSION_ACTIVITY_TABLE: dedalo_ts_test_ci_activity_diffusion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Link sibling paths (../private, PHP tree, client lib)
        run: bash scripts/ci/link_siblings.sh
      - name: Runner preconditions (bun pin, env, service probes)
        run: bash scripts/ci/env_guard.sh
      - name: Install
        run: bun install --frozen-lockfile
      # --timeout=30000 is a LITERAL COPY of TEST_TIMEOUT_MS in scripts/lib/test_flags.ts,
      # which is the source of truth; a workflow file cannot import it, and a `bun -e`
      # readback would add a bun subprocess to every CI tier for a copy that would still
      # exist. A tripwire gate keeps this literal in step with the constant. It is on the
      # command line and not in bunfig.toml because Bun 1.4.0 SILENTLY IGNORES
      # `[test] timeout`.
      - name: Full suite (unit + parity, frozen-fixture oracle)
        shell: bash
        run: bun test --timeout=30000 test/unit test/parity 2>&1 | tee full-suite.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: full-suite-log
          path: full-suite.log
