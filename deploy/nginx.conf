# Dédalo v7 — reference nginx configuration.
#
# Drop this in as an http{}-scope snippet:
#   bare metal : /etc/nginx/conf.d/dedalo.conf   (Debian/Ubuntu also work with
#                sites-available + a symlink, but conf.d is included inside
#                http{}, which the `map` below REQUIRES)
#   container  : mounted at /etc/nginx/conf.d/default.conf
#
# Operator guide: docs/install/reverse_proxy.md
#
# Substitutions (search for these):
#   dedalo.example.org               your domain
#   /run/dedalo/dedalo_ts.sock       SERVER_UNIX_SOCKET
#   /opt/dedalo/master_dedalo        the repo
#   /srv/dedalo/media                MEDIA_PATH
#
# THE ROOT RULE (read this before you change a path):
#   The media rule files are GENERATED by the engine and carry no root/alias of
#   their own — they inherit the server root. So the server `root` MUST satisfy
#       <root> + /dedalo/<DEDALO_MEDIA_DIR>/…  ==  MEDIA_PATH/…
#   With the canonical layout (MEDIA_PATH=/srv/dedalo/media, media dir 'media')
#   that is exactly `root /srv;`. Get this wrong and every media file 404s while
#   the access gate itself still looks healthy.

# --- http{} scope ------------------------------------------------------------
# The auth-cookie sanitiser. A `map` cannot live inside server{}; omit this and
# nginx REFUSES TO START ("unknown $dedalo_auth_key") — deliberately, because a
# half-wired media gate must never boot half-open.
#
# Shipped COMMENTED: the file does not exist until the engine's first boot (step
# 10). Uncomment BOTH this and the server-scope include below after that boot,
# then `nginx -t && systemctl reload nginx`. Both or neither — this map defines
# $dedalo_auth_key that the server include needs.
# include /srv/dedalo/media/dedalo_media_protection_map.nginx.conf;

# ---------------------------------------------------------------------------
# REQUEST-RATE CEILING ON THE API DOOR (audit 2026-08-26 SEC-21).
#
# The engine's own login throttle is keyed by username and by (username, IP), so
# a caller that ROTATES the username minted a fresh bucket on every request, and
# nothing here bounded the RATE at all: with `client_max_body_size 300m` below,
# ONE unauthenticated client could keep the engine writing megabytes of audit
# rows for as long as it liked (measured 67 MB stored from a single request).
# The engine now bounds the payload and adds a source-global login bucket; this
# is the hop in front of it, and it is the one that costs the engine nothing.
#
# 20 r/s sustained with a burst of 40, per SOURCE ADDRESS, released as fast as
# nginx can (`nodelay`) so a legitimate page — which fans out into a dozen
# parallel component reads — is never delayed, only a flood is refused. 10 MB of
# shared state holds ~160k addresses.
#
# It sits in the `http` context, beside `upstream`, because that is the only
# context `limit_req_zone` is valid in; the `limit_req` that USES it is on the
# API location.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=dedalo_api:10m rate=20r/s;

upstream dedalo_ts {
	server unix:/run/dedalo/dedalo_ts.sock;
}

server {
	listen 80;
	listen [::]:80;
	server_name dedalo.example.org;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;                       # multiplexes the 35-module client boot graph
	server_name dedalo.example.org;

	ssl_certificate     /etc/letsencrypt/live/dedalo.example.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/dedalo.example.org/privkey.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;

	# See THE ROOT RULE above. Only the generated media locations resolve files
	# against it; every other path is either proxied, aliased, or refused below.
	root /srv;

	# The client uploads in ~4 MB chunks and the engine accepts up to
	# SERVER_MAX_BODY_BYTES (256 MiB) per request. nginx's default is 1m, which
	# breaks every upload with a 413.
	client_max_body_size 300m;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options    "nosniff"   always;
	add_header X-Frame-Options           "SAMEORIGIN" always;
	add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

	# --- Media ---------------------------------------------------------------
	# EITHER the gate OR the open block below — exactly one, never both and never
	# neither. With neither, /dedalo/media/ falls through to the client alias
	# further down and every file 404s: media is not served at all, which is the
	# safe failure and the state this file ships in.
	#
	# (a) GATED — the engine enforces access, per record and per project.
	# GENERATED by the engine into MEDIA_PATH, refreshed at boot and at login.
	# Shipped COMMENTED until the engine's first boot (step 10) writes this file.
	# Uncomment (with the http-scope map include above) after that first boot.
	# include /srv/dedalo/media/dedalo_media_protection.nginx.conf;

	# (b) OPEN — no access control at all. Anyone who can reach this server reads
	# every media file, logged in or not. Uncomment this INSTEAD of (a), and only
	# when that sentence is genuinely acceptable for this collection: an internal
	# instance, or one whose media is public by policy. It needs no engine
	# support, so it works from the first boot and needs no map include — leave
	# DEDALO_MEDIA_ACCESS_MODE unset, and the engine writes no rule files.
	# The root rule at the top of this file is what maps the URL onto MEDIA_PATH.
	# location /dedalo/media/ {
	#	open_file_cache off;
	# }

	# A stat() cache delays an unpublish taking effect. Keep it off.
	open_file_cache off;

	# --- Liveness probe → the Bun socket -------------------------------------
	# The engine serves its health check at the origin root `/health`
	# (src/server.ts). The watchdog hits it over the unix socket, but the
	# browser-facing system_info maintenance widget probes it over HTTP too, so
	# it must be reachable here — otherwise the catch-all `location / { 404 }`
	# below swallows it and the widget reports the engine unhealthy.
	location = /health {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# --- API + dynamic routes → the Bun socket -------------------------------
	# A regex location beats every prefix location below it, so this keeps
	# precedence over the /dedalo/ static alias.
	location ~ ^/(api/v1/|dedalo/core/api/) {
		# The rate ceiling declared at the top of this file. `nodelay` releases
		# the burst immediately: a page load is a burst by nature.
		limit_req zone=dedalo_api burst=40 nodelay;
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# >= SERVER_IDLE_TIMEOUT_S (255). A lower value kills slow exports,
		# long searches and tool actions one hop before the engine would.
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		# SSE + NDJSON streaming (assistant chat, diffusion, export).
		proxy_buffering off;
	}

	# --- Dynamic routes that live UNDER /dedalo/ but are NOT static files ----
	# Each of these is served by the engine, not from client/. Proxy them, or
	# they 404 against the client tree.

	# Third-party browser libraries (resolved through the allowlist to
	# node_modules/ and vendor/ — there is no client/dedalo/lib/ directory).
	location /dedalo/lib/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# Tool packages (repo tools/ root) and the shared tool machinery.
	location /dedalo/tools/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}
	location /dedalo/core/tools_common/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# The inline-tag image factory (one <img> per inline tag in a rich text).
	location = /dedalo/core/component_text_area/tag/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# Ontology snapshots — only if this instance is an ontology master
	# (IS_AN_ONTOLOGY_SERVER=true). Harmless otherwise: the engine 404s.
	location /dedalo/install/import/ontology/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# Code-master release archives — only if this instance is a code master
	# (IS_A_CODE_SERVER=true). This is the URL the update manifest ADVERTISES to
	# remote installs; unrouted, every code update dies on a 404 from the client
	# alias below. Harmless otherwise: the engine 404s.
	location /dedalo/install/code/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# Hierarchy export downloads (admin-session-gated).
	location /dedalo/install/import/hierarchy/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# The local AI model store — ONNX weights the BROWSER fetches from the page
	# origin (transformers.js `env.remoteHost`). Served from the private dir, so
	# no client subtree answers it.
	location /dedalo/ai_models/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# Staged-upload previews (the browser shows the file it just uploaded, before
	# the record is saved). Session-gated and owner-scoped by the engine.
	location /dedalo/upload_tmp/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# tool_export's built files (csv/xlsx/ods/html/ndjson/media zip) — owner-only,
	# session-gated by the engine, 404 for anyone else. Multi-GB files: stream them
	# (no buffering to proxy temp files, which caps at proxy_max_temp_file_size).
	location /dedalo/export/artifact/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_buffering off;
	}

	# --- Entry points --------------------------------------------------------
	# The client tree has no index.html above core/page/, so these paths would hit
	# the alias below and 403/404 on a user who typed the mount point instead of
	# the full page path. The ENGINE answers them with the same 302 (server.ts
	# ENTRY_REDIRECT_PATHS) — repeated here only because nginx serves the client
	# tree itself and these requests never reach the socket. Exact (=) locations
	# win over both the prefix alias and the API regex above.
	location = /dedalo      { return 302 /dedalo/core/page/; }
	location = /dedalo/     { return 302 /dedalo/core/page/; }
	location = /dedalo/core { return 302 /dedalo/core/page/; }
	location = /dedalo/core/ { return 302 /dedalo/core/page/; }

	# --- Client static files -------------------------------------------------
	# The client tree is served IN PLACE (not content-hashed), so text assets
	# must revalidate — never mark them immutable.
	location /dedalo/ {
		alias /opt/dedalo/master_dedalo/client/dedalo/;
		etag on;
		add_header Cache-Control "no-cache";
		gzip on;
		gzip_types text/css application/javascript application/json image/svg+xml;
		gzip_min_length 1024;

		location ~* \.(png|jpe?g|gif|webp|ico|woff2?|ttf|otf)$ {
			add_header Cache-Control "public, max-age=3600";
		}
	}

	location = / { return 302 /dedalo/core/page/; }
	location   / { return 404; }
}
