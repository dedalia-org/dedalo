# Dédalo v7 — SIMPLE reference nginx configuration (no media access control).
#
# Used by docker-compose.simple.yml, which mounts it at
# /etc/nginx/conf.d/default.conf. Operator guide: docs/install/quickstart.md
#
# WHAT THIS IS
#   The same proxy wiring as deploy/nginx.conf, with two deliberate removals:
#     1. no TLS — plain HTTP on port 80;
#     2. no media access control — media is served straight from MEDIA_PATH by
#        the `location /dedalo/media/` block below, with NO per-record and NO
#        per-project checks.
#
#   Anyone who can reach this server can read every media file, logged in or
#   not. That is the trade this file makes, and it is why it must never front an
#   instance reachable from the internet. For that, use deploy/nginx.conf and
#   docs/install/docker.md — the media gate is not optional there.
#
# TRANSPORT — A RECORDED DECISION, NOT AN OVERSIGHT (CLI-28).
#   This file serves the client over plain HTTP/1.1 on port 80, and no
#   `http2 on;` appears below. That is not a missing line: no browser
#   negotiates HTTP/2 in cleartext (h2c is never attempted from a URL bar; h2
#   is chosen through the TLS ALPN handshake), so on a port-80 server http2 is
#   IMPOSSIBLE, not merely unchosen. nginx would accept the directive and no
#   client would ever use it.
#
#   THE COST, MEASURED — not estimated. The page boot is a static ES module
#   graph; `test/unit/page_load_budget_native.test.ts` walks it through the
#   engine's own serving door and asserts these exact numbers, which are its
#   shrink-only ceilings. Edit them here and the gate goes red:
#     BOOT_MODULES 35      static ES modules, entry included — each one a request
#     BOOT_DEPTH 5         discovery levels — a module is only requested once
#                          its importer arrived, so this many serial round-trips
#                          pass before the last module is even known to exist
#     BOOT_HEAD_ASSETS 4   subresources the HTML itself declares besides the
#                          module entry (2 classic scripts, main.css, favicon)
#     BOOT_REQUESTS 39     the whole cold-boot critical path, before the first
#                          `start` API call
#   Over HTTP/1.1 a browser opens at most 6 connections per origin, so those 39
#   requests queue in ~7 waves and the 5 discovery rounds cannot overlap; each
#   request also repeats the full header set. Over h2 they are one connection,
#   multiplexed, with compressed headers. On a LAN this costs tens of
#   milliseconds; over a WAN it is the difference an operator feels.
#
#   THE ESCAPE IS CODE, NOT ADVICE. `install.sh` `choose_tls` offers four
#   modes; 1-3 (Let's Encrypt, a local CA, your own certificate) render
#   `deploy/nginx.simple-tls.conf.tpl` into `deploy/nginx.simple.generated.conf`
#   — TLS-terminating, `http2 on;`, same media policy. ONLY mode 4 (`tls_none`,
#   "no HTTPS, internal test only") selects THIS file. So the fix for the
#   transport is the fix for the far larger problem of cleartext passwords:
#   re-run the installer and pick a certificate. Anyone reaching for h2 here
#   wants mode 2.

# THE ROOT RULE (read this before you change a path):
#   The media location carries no root/alias of its own — it inherits the server
#   root. So the server `root` MUST satisfy
#       <root> + /dedalo/<DEDALO_MEDIA_DIR>/…  ==  MEDIA_PATH/…
#   With the canonical layout (MEDIA_PATH=/srv/dedalo/media, media dir 'media')
#   that is exactly `root /srv;`.

# ---------------------------------------------------------------------------
# REQUEST-RATE CEILING ON THE API DOOR (audit 2026-08-26 SEC-21).
#
# The engine's own login throttle is keyed by username and by (username, IP), so
# a caller that ROTATES the username minted a fresh bucket on every request, and
# nothing here bounded the RATE at all: with `client_max_body_size 300m` below,
# ONE unauthenticated client could keep the engine writing megabytes of audit
# rows for as long as it liked (measured 67 MB stored from a single request).
# The engine now bounds the payload and adds a source-global login bucket; this
# is the hop in front of it, and it is the one that costs the engine nothing.
#
# 20 r/s sustained with a burst of 40, per SOURCE ADDRESS, released as fast as
# nginx can (`nodelay`) so a legitimate page — which fans out into a dozen
# parallel component reads — is never delayed, only a flood is refused. 10 MB of
# shared state holds ~160k addresses.
#
# It sits in the `http` context, beside `upstream`, because that is the only
# context `limit_req_zone` is valid in; the `limit_req` that USES it is on the
# API location.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=dedalo_api:10m rate=20r/s;

upstream dedalo_ts {
	server unix:/run/dedalo/dedalo_ts.sock;
}

server {
	listen 80;
	listen [::]:80;
	# Answers on any name or address — no domain to substitute, which is the
	# point of this file. deploy/nginx.conf is where a real server_name belongs.
	server_name _;

	# See THE ROOT RULE above.
	root /srv;

	# The client uploads in ~4 MB chunks and the engine accepts up to
	# SERVER_MAX_BODY_BYTES (256 MiB) per request. nginx's default is 1m, which
	# breaks every upload with a 413.
	client_max_body_size 300m;

	add_header X-Content-Type-Options    "nosniff"    always;
	add_header X-Frame-Options           "SAMEORIGIN" always;
	add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

	# --- Media: SERVED OPENLY ------------------------------------------------
	# deploy/nginx.conf `include`s two engine-generated rule files here instead.
	# This block is their replacement, and it enforces nothing: it maps the URL
	# space onto the media tree and serves the bytes.
	#
	# Prefix `location` (not regex) so it beats the /dedalo/ client alias below
	# for media URLs while staying below the exact and regex matches above.
	location /dedalo/media/ {
		# No `alias`: the root rule above already resolves this to MEDIA_PATH.
		# A stat() cache would delay a deletion taking effect. Keep it off.
		open_file_cache off;
	}

	# --- Liveness probe → the Bun socket -------------------------------------
	# The browser-facing system_info maintenance widget probes this over HTTP,
	# so it must be reachable here or the catch-all 404 below swallows it and the
	# widget reports the engine unhealthy.
	location = /health {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# --- API + dynamic routes → the Bun socket -------------------------------
	# A regex location beats every prefix location, so this keeps precedence over
	# the /dedalo/ static alias.
	location ~ ^/(api/v1/|dedalo/core/api/) {
		# The rate ceiling declared at the top of this file. `nodelay` releases
		# the burst immediately: a page load is a burst by nature.
		limit_req zone=dedalo_api burst=40 nodelay;
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# >= SERVER_IDLE_TIMEOUT_S (255). A lower value kills slow exports,
		# long searches and tool actions one hop before the engine would.
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
		# SSE + NDJSON streaming (assistant chat, diffusion, export).
		proxy_buffering off;
	}

	# --- Dynamic routes that live UNDER /dedalo/ but are NOT static files ----
	# Each of these is served by the engine, not from client/. Proxy them, or
	# they 404 against the client tree.

	# Third-party browser libraries (resolved through the allowlist to
	# node_modules/ and vendor/ — there is no client/dedalo/lib/ directory).
	location /dedalo/lib/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# Tool packages (repo tools/ root) and the shared tool machinery.
	location /dedalo/tools/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}
	location /dedalo/core/tools_common/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# The inline-tag image factory (one <img> per inline tag in a rich text).
	location = /dedalo/core/component_text_area/tag/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# Ontology snapshots — only if this instance is an ontology master
	# (IS_AN_ONTOLOGY_SERVER=true). Harmless otherwise: the engine 404s.
	location /dedalo/install/import/ontology/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# Code-master release archives — only if this instance is a code master
	# (IS_A_CODE_SERVER=true). This is the URL the update manifest ADVERTISES to
	# remote installs; unrouted, every code update dies on a 404 from the client
	# alias below. Harmless otherwise: the engine 404s.
	location /dedalo/install/code/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# Hierarchy export downloads (admin-session-gated).
	location /dedalo/install/import/hierarchy/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# The local AI model store — ONNX weights the BROWSER fetches from the page
	# origin (transformers.js `env.remoteHost`). Served from the private dir, so
	# no client subtree answers it.
	location /dedalo/ai_models/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# Staged-upload previews (the browser shows the file it just uploaded, before
	# the record is saved). Session-gated and owner-scoped by the engine.
	location /dedalo/upload_tmp/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
	}

	# tool_export's built files (csv/xlsx/ods/html/ndjson/media zip) — owner-only,
	# session-gated by the engine, 404 for anyone else. Multi-GB files: stream them
	# (no buffering to proxy temp files, which caps at proxy_max_temp_file_size).
	location /dedalo/export/artifact/ {
		proxy_pass http://dedalo_ts;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_buffering off;
	}

	# --- Entry points --------------------------------------------------------
	# The client tree has no index.html above core/page/, so these paths would
	# hit the alias below and 403/404 on a user who typed the mount point instead
	# of the full page path. Exact (=) locations win over both the prefix alias
	# and the API regex above.
	location = /dedalo      { return 302 /dedalo/core/page/; }
	location = /dedalo/     { return 302 /dedalo/core/page/; }
	location = /dedalo/core { return 302 /dedalo/core/page/; }
	location = /dedalo/core/ { return 302 /dedalo/core/page/; }

	# --- Client static files -------------------------------------------------
	# The client tree is served IN PLACE (not content-hashed), so text assets
	# must revalidate — never mark them immutable.
	location /dedalo/ {
		alias /opt/dedalo/master_dedalo/client/dedalo/;
		etag on;
		add_header Cache-Control "no-cache";
		gzip on;
		gzip_types text/css application/javascript application/json image/svg+xml;
		gzip_min_length 1024;

		location ~* \.(png|jpe?g|gif|webp|ico|woff2?|ttf|otf)$ {
			add_header Cache-Control "public, max-age=3600";
		}
	}

	location = / { return 302 /dedalo/core/page/; }
	location   / { return 404; }
}
