# Dédalo v7 — reference Apache configuration.
#
# The Apache TWIN of deploy/nginx.conf. Same routes, same socket, same failure
# modes — read that file's comments for the reasoning; only the Apache-specific
# traps are repeated here.
#
# Drop this in as:
#   Debian/Ubuntu : /etc/apache2/sites-available/dedalo.conf  (a2ensite dedalo)
#   RHEL family   : /etc/httpd/conf.d/dedalo.conf
#
# Operator guide: docs/install/reverse_proxy.md
#
# Modules (both families):
#   a2enmod ssl headers http2 rewrite proxy proxy_http alias
#
# Substitutions (search for these):
#   dedalo.example.org               your domain
#   /run/dedalo/dedalo_ts.sock       SERVER_UNIX_SOCKET
#   /opt/dedalo/master_dedalo        the repo
#   /srv/dedalo/media                MEDIA_PATH
#
# ORDER IS THE WHOLE CONFIGURATION. Within mod_alias and mod_proxy the FIRST
# match wins, so the file reads top-down: liveness → API → dynamic /dedalo/
# routes → entry redirects → media alias → client alias → catch-all. Move a
# rule up past another and you will serve a directory listing where a proxy
# belonged, or 404 an API call against the client tree.

<VirtualHost *:80>
	ServerName dedalo.example.org
	Redirect permanent / https://dedalo.example.org/
</VirtualHost>

<VirtualHost *:443>
	ServerName dedalo.example.org
	# h2 multiplexes the 35-module client boot graph.
	# (Apache honours `#` only at the START of a line — never append a comment
	# to a directive here, it is parsed as an argument and refuses to start.)
	Protocols h2 http/1.1

	SSLEngine on
	SSLCertificateFile    /etc/letsencrypt/live/dedalo.example.org/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/dedalo.example.org/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf

	# Apache has no DocumentRoot-less vhost. Nothing is ever served from here:
	# every real path below is proxied or aliased, and the default `Require all
	# denied` on an unconfigured tree is what turns an UNROUTED path into an
	# AH01630 403 in the error log. A 403 on a path this file should have routed
	# (`/health` is the classic) means the rule is missing, not that permissions
	# are wrong — add the route, never widen the DocumentRoot.
	# Create it once: `mkdir -p /var/www/empty` (Apache warns if it is missing).
	DocumentRoot /var/www/empty

	ProxyPreserveHost On
	# >= SERVER_IDLE_TIMEOUT_S (255): a lower value kills slow exports, long
	# searches and tool actions one hop before the engine would.
	ProxyTimeout 300

	# The client uploads in ~4 MB chunks; the engine accepts up to
	# SERVER_MAX_BODY_BYTES (256 MiB) per request. Apache's default is unlimited —
	# state it anyway so a hardening baseline cannot silently clamp uploads.
	LimitRequestBody 314572800

	# --- Liveness probe → the Bun socket -------------------------------------
	# The engine serves its health check at the ORIGIN ROOT `/health`
	# (src/server.ts). The watchdog hits it over the unix socket, but the browser
	# client probes it over HTTP too (client/dedalo/core/common/js/data_manager.js,
	# the system_info + update_code maintenance widgets, the service worker).
	# WITHOUT THIS RULE Apache resolves /health against the DocumentRoot, finds
	# nothing, and denies it: `AH01630 client denied by server configuration:
	# …/health`. The engine is healthy; the widget says it is not, and the
	# post-update restart poll can never confirm the new version.
	ProxyPass        /health unix:/run/dedalo/dedalo_ts.sock|http://localhost/health
	ProxyPassReverse /health unix:/run/dedalo/dedalo_ts.sock|http://localhost/health

	# --- API + dynamic routes → the Bun socket -------------------------------
	# SSE + NDJSON streaming (assistant chat, diffusion, export) needs flushing,
	# not buffering: mod_proxy_http streams by default, so do NOT add
	# `SetOutputFilter DEFLATE` or a buffering filter on these paths.
	ProxyPass /api/v1/          unix:/run/dedalo/dedalo_ts.sock|http://localhost/api/v1/
	ProxyPass /dedalo/core/api/ unix:/run/dedalo/dedalo_ts.sock|http://localhost/dedalo/core/api/

	# --- Dynamic routes that live UNDER /dedalo/ but are NOT static files ----
	# Each is served by the engine, not from client/. They MUST be listed before
	# `Alias /dedalo` below or they 404 against the client tree.

	# Third-party browser libraries (resolved through the allowlist to
	# node_modules/ and vendor/ — there is no client/dedalo/lib/ directory).
	ProxyPass /dedalo/lib/                          unix:/run/dedalo/dedalo_ts.sock|http://localhost/dedalo/lib/
	# Tool packages (repo tools/ root) and the shared tool machinery.
	ProxyPass /dedalo/tools/                        unix:/run/dedalo/dedalo_ts.sock|http://localhost/dedalo/tools/
	ProxyPass /dedalo/core/tools_common/            unix:/run/dedalo/dedalo_ts.sock|http://localhost/dedalo/core/tools_common/
	# The inline-tag image factory (one <img> per inline tag in a rich text).
	ProxyPass /dedalo/core/component_text_area/tag/ unix:/run/dedalo/dedalo_ts.sock|http://localhost/dedalo/core/component_text_area/tag/
	# Ontology snapshots — only if this instance is an ontology master
	# (IS_AN_ONTOLOGY_SERVER=true). Harmless otherwise: the engine 404s.
	ProxyPass /dedalo/install/import/ontology/      unix:/run/dedalo/dedalo_ts.sock|http://localhost/dedalo/install/import/ontology/
	# Code-master release archives — only if this instance is a code master
	# (IS_A_CODE_SERVER=true). The URL the update manifest ADVERTISES to remote
	# installs; unrouted, every code update dies on a 404 from the client Alias.
	ProxyPass /dedalo/install/code/                 unix:/run/dedalo/dedalo_ts.sock|http://localhost/dedalo/install/code/
	# Hierarchy export downloads (admin-session-gated).
	ProxyPass /dedalo/install/import/hierarchy/     unix:/run/dedalo/dedalo_ts.sock|http://localhost/dedalo/install/import/hierarchy/
	# The local AI model store — ONNX weights the BROWSER fetches from the page
	# origin. Served from the private dir; no client subtree answers it.
	ProxyPass /dedalo/ai_models/                    unix:/run/dedalo/dedalo_ts.sock|http://localhost/dedalo/ai_models/
	# Staged-upload previews (session-gated, owner-scoped by the engine).
	ProxyPass /dedalo/upload_tmp/                   unix:/run/dedalo/dedalo_ts.sock|http://localhost/dedalo/upload_tmp/
	# tool_export's built files (owner-only, session-gated by the engine).
	ProxyPass /dedalo/export/artifact/              unix:/run/dedalo/dedalo_ts.sock|http://localhost/dedalo/export/artifact/

	# Media and the client tree are served from disk by Apache, never proxied.
	ProxyPass /dedalo/media !
	ProxyPass /dedalo       !

	# --- Entry points --------------------------------------------------------
	# The client tree has no index.html above core/page/, so a user who typed the
	# mount point would hit the alias below and get a 403/404. The ENGINE answers
	# these with the same 302 (server.ts ENTRY_REDIRECT_PATHS); repeated here
	# because Apache serves the client tree itself and these never reach the
	# socket. Must precede the aliases.
	RedirectMatch 302 "^/dedalo/?$"      /dedalo/core/page/
	RedirectMatch 302 "^/dedalo/core/?$" /dedalo/core/page/
	RedirectMatch 302 "^/$"              /dedalo/core/page/

	# --- Media ---------------------------------------------------------------
	# Apache's half of the media gate is the GENERATED <MEDIA_PATH>/.htaccess
	# (src/core/media/protection.ts), re-read per request — no reload needed.
	Alias /dedalo/media /srv/dedalo/media
	<Directory /srv/dedalo/media>
		# WITHOUT AllowOverride the generated .htaccess is ignored — SILENTLY,
		# and OPEN. This single line is the whole media gate on Apache.
		AllowOverride All
		Options -Indexes -ExecCGI
		Require all granted
	</Directory>

	# --- Client static files -------------------------------------------------
	# The client tree is served IN PLACE (not content-hashed), so text assets
	# must revalidate — never mark them immutable.
	Alias /dedalo /opt/dedalo/master_dedalo/client/dedalo
	<Directory /opt/dedalo/master_dedalo/client/dedalo>
		Options -Indexes
		AllowOverride None
		Require all granted
		Header set Cache-Control "no-cache"
		<FilesMatch "\.(png|jpe?g|gif|webp|ico|woff2?|ttf|otf)$">
			Header set Cache-Control "public, max-age=3600"
		</FilesMatch>
	</Directory>

	Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
	Header always set X-Content-Type-Options    "nosniff"
	Header always set X-Frame-Options           "SAMEORIGIN"
	Header always set Referrer-Policy           "strict-origin-when-cross-origin"
</VirtualHost>
