# Plain HTTP: every request goes to the TLS site, on both address families.
<VirtualHost 0.0.0.0:80>
    ServerName museum.org
    <IfModule mod_alias.c>
        Redirect permanent / https://museum.org/
    </IfModule>
</VirtualHost>
<VirtualHost [::]:80>
    ServerName museum.org
    RedirectMatch 301 ^/(.*)$ https://museum.org/$1
</VirtualHost>
