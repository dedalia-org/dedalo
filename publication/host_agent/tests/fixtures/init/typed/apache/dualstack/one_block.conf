<IfModule mod_ssl.c>
<VirtualHost 192.0.2.1:443 [2001:db8::1]:443>
    ServerName museum.org
    ServerAlias www.museum.org
    DocumentRoot /home/museum.org/httpdocs
    ErrorLog /var/log/apache2/museum.org/error.log
    CustomLog /var/log/apache2/museum.org/access.log combined
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/museum.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/museum.org/privkey.pem
</VirtualHost>
</IfModule>
