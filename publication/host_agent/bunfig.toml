[install]
peer = false
# No by-name fetch outside bun.lock (see the root bunfig.toml).
auto = "disable"

[test]
# ENFORCED from the first commit (the site_builder reporting-only exemption is NOT
# inherited): Bun applies the threshold PER FILE, so every module this package adds
# arrives with tests that clear it, or the package suite is red.
coverage = true
# Declares this checkout the suite's (.test-tmp/ marker) before any module resolves the
# config: src/config.ts reads the committed .env.test only in a declared checkout.
preload = ["./tests/preload.ts"]
coverageThreshold = { lines = 0.8, functions = 0.8 }
# The repo-root test helpers (scratch_dir, regex_escape) these gates import are GATE code
# shared with the root suite, measured there — not this package's daemon code.
# tests/preload.ts is the suite's own harness (bunfig [test] preload): its planting path
# EXISTS ONLY on a fresh .test-tmp and deliberately never runs again (that is the
# "never wipes" law), so a second run in the same checkout measures 61.54% lines and
# reddened the package on every run after the first — while what it plants is asserted
# where it belongs, in tests/deployed_test_mode.test.ts (absent / symlinked / foreign
# marker, and PRELOAD_INSTANCE pinned to the fixture's INSTANCE).
coveragePathIgnorePatterns = ["../../test/**", "**/tests/preload.ts"]

[run]
bun = true
