# Bun runtime configuration (precedent: diffusion/api/v1/bunfig.toml)
console.depth = 10

[install]
# Bun's auto-install resolves a bare import BY NAME from the registry, ignoring
# bun.lock, whenever a command runs in a checkout with no node_modules — bytes
# no lockfile digest pins. Off: a missing install is a loud "Cannot find
# package", never a silent fetch. Gate: dependency_integrity_tripwire.
auto = "disable"

[test]
# NO `timeout` KEY HERE — ON PURPOSE. Bun 1.4.0 (pinned then) SILENTLY
# IGNORES `[test] timeout` (still on 1.4.2, 1.4.3 and 1.4.4, re-measured 2026-09-23,
# 2026-10-14 and 2026-11-02): measured 2026-08-25, an 8 s test under this exact
# bunfig died at 5001.50 ms with "this test timed out after 5000ms", while the
# same test under `bun test --timeout=30000` passed in 8.01 s. The key sat here
# declaring 30000 and buying nothing — a stated-but-unenforced invariant, which
# is precisely what DEC-12 forbids. The number now lives in
# scripts/lib/test_flags.ts (TEST_TIMEOUT_MS / TEST_TIMEOUT_FLAG) and is passed
# on the COMMAND LINE at every site that spawns `bun test`. Do not re-add it
# here: a future Bun that honours it would make this file a second source of
# truth for the same number.
# Confine test discovery to our test/ tree — the COPIED CLIENT (client/dedalo)
# contains view files whose names match test globs (core/widgets/test/…).
root = "test"
# S1-18: point session_store at a per-run scratch sqlite BEFORE any test module
# imports it — bun test must never touch the live ../private session store.
# S2-20: component_registry.ts registers the ontology↔components model lookup
# (the same module-load side effect production boot performs — see
# src/core/ontology/resolver.ts seam note).
# ORDER MATTERS.
# 1. test_media    — sets DEDALO_TEST_MEDIA_ROOT, which repoints the media root AND arms
#    the .dedalo_test_media guard. It is FIRST for a second reason on top of the freeze
#    rule below: the tree is keyed by the SUITE DATABASE NAME, which it derives as
#    `<DB_NAME>_test` — so it has to read DB_NAME while it still names the APPLICATION
#    database, i.e. before test_database rewrites it.
# 2. test_database — repoints DB_NAME at the dedicated test DB. Both of these have to
#    rewrite process.env before any module imports src/config/config.ts, which freezes the
#    connection AND the media root at import. Everything below then talks to the test DB
#    and the test media tree, never the app's.
# 3. session_db     — per-run scratch sqlite / ts_state / diffusion tables (S1-18).
# 4. component_registry — the model lookup production boot performs (S2-20).
# 5. canonical_test3 — re-seeds the test3 playground FROM CODE, so a developer's edit to a
#    playground record cannot break the gates whose goldens pin its values.
# 6. rag_db        — sets DEDALO_TEST_RAG_DB_NAME, which repoints the pgvector store AND arms
#    its dedalo_test_rag_marker guard (P1-16). ARMING is order-independent (the key is read
#    live, no preload builds the rag pool, no test module has been imported yet); its
#    PROVISIONING step is not. Provisioning dynamically imports the marker writer
#    src/ai/rag/test_rag_db.ts, whose static graph — 42 src/ modules, re-derivable with
#    `bun build src/ai/rag/test_rag_db.ts --target=bun` — reaches src/config/config.ts (via
#    core/errors/index.ts -> log.ts -> core/api/counters.ts -> core/security/session_store.ts
#    -> core/media/protection.ts), which FREEZES DB_NAME and the media root at import, and on
#    the same edge session_store.ts itself, which OPENS the sqlite session store at module
#    scope on a path resolved at import. That is why it sits below 1-3, and only below 1-3:
#    above them the import would freeze the config and open the session store at the
#    INSTALLATION's values — the three defects those files exist to prevent. It does NOT
#    reach src/core/db/postgres.ts, so it neither builds nor connects the matrix pool; 4 and
#    5 could equally precede or follow it. Of those two it is 4 (component_registry) that
#    builds the matrix pool, via src/core/components/registry.ts -> ontology/resolver.ts;
#    5 (canonical_test3) has no static imports at all. Last is simply the free position
#    that satisfies the one real constraint.
# 7. suite_mariadb — arms the diffusion MariaDB keys at THIS LANE's suite server (PUB-05):
#    socket/user of `test/helpers/suite_mariadb_env.ts`, blank host+port, set unconditionally,
#    so no test process can reach the installation's MariaDB. Placed right after
#    test_database (its lane name is testDatabaseName(), pinned there); no I/O, no src/ graph.
# 8. engine_state  — sweeps the AI spend ledger, so a suite database is never walked into a
#    fixture user's budget. Last: it imports the write path (config freeze, the matrix
#    pool), so it needs 1-3 done.
# The DB-touching preloads warn (never throw) when there is no Postgres — the hermetic tier
# runs on a bare runner, and a throw here would take down all ~2000 tests.
preload = [
	"./test/preload/test_media.ts",
	"./test/preload/test_database.ts",
	"./test/preload/suite_mariadb.ts",
	"./test/preload/session_db.ts",
	"./test/preload/component_registry.ts",
	"./test/preload/canonical_test3.ts",
	"./test/preload/rag_db.ts",
	"./test/preload/engine_state.ts",
]
